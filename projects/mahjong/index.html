<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg:        #E9EDE6;
  --felt:      #12483A;
  --felt-deep: #0C3529;
  --tile:      #FBF9F3;
  --tile-edge: #DAD5C6;
  --tile-ink:  #1A2420;
  --surface:   #FFFFFF;
  --surface-2: #EFF2EC;
  --ink:       #16211C;
  --muted:     #64756C;
  --accent:    #14624E;
  --gold:      #B08A2E;
  --red:       #A5382B;
  --rule:      #D6DDD3;
  --shadow:    rgba(16, 30, 24, .16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0A120F;
    --felt:      #10382C;
    --felt-deep: #08241C;
    --tile:      #EDEAE0;
    --tile-edge: #B9B4A4;
    --tile-ink:  #17201C;
    --surface:   #141F1A;
    --surface-2: #1B2822;
    --ink:       #E7EEE9;
    --muted:     #8CA298;
    --accent:    #4FBB9A;
    --gold:      #D9B45A;
    --red:       #E2796C;
    --rule:      #24332D;
    --shadow:    rgba(0, 0, 0, .55);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html {
  height: 100%;
  /* 手機轉橫掂唔好自己放大字 */
  -webkit-text-size-adjust: 100%;
  /* 唔好落拉刷新／唔好彈彈吓——打牌打到一半 reload 就大鑊 */
  overscroll-behavior: none;
}
body {
  /* 100vh 喺 iOS Safari 會計埋工具列，撞到個底。
     svh = 工具列出晒嗰陣嘅高度，所以永遠唔會被遮，亦唔會跟住工具列跳。 */
  height: 100vh;
  height: 100svh;
  overscroll-behavior: none;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Segoe UI", system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  -webkit-user-select: none;
  user-select: none;
  overflow: hidden;
}
button { font: inherit; cursor: pointer; color: inherit; }
button:active:not(:disabled) { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ══ header：局面做主角 ══ */
header {
  display: flex;
  align-items: center;
  gap: .7rem;
  /* 瀏海／動態島底下唔可以擺嘢 */
  padding: calc(.75rem + env(safe-area-inset-top)) calc(.95rem + env(safe-area-inset-right))
           .6rem calc(.95rem + env(safe-area-inset-left));
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.round-block { flex: 1; min-width: 0; }
.round-label {
  font-family: "Songti TC", "Noto Serif TC", serif;
  font-size: 1.32rem;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: .02em;
}
.round-sub {
  font-size: .69rem;
  color: var(--muted);
  margin-top: .12rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.streak-pill {
  display: inline-block;
  background: var(--gold);
  color: #fff;
  font-size: .62rem;
  font-weight: 600;
  padding: .06rem .34rem;
  border-radius: 3px;
  margin-left: .35rem;
  vertical-align: 2px;
}
.streak-pill[hidden] { display: none !important; }
.icons { display: flex; gap: .3rem; flex-shrink: 0; }
.icon-btn {
  /* Apple HIG：可撳嘅嘢最細 44×44 */
  width: 2.75rem; height: 2.75rem;
  border: 1px solid var(--rule);
  background: var(--surface-2);
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: .96rem;
}
.icon-btn:disabled { opacity: .33; }

/* ══ 檯面 ══ */
main {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  padding: .5rem calc(.7rem + env(safe-area-inset-right)) .5rem calc(.7rem + env(safe-area-inset-left));
  min-height: 0;
}
.felt {
  width: min(100%, 30rem, 100%);
  aspect-ratio: 1;
  max-height: 100%;
  background: radial-gradient(ellipse at 50% 42%, var(--felt) 0%, var(--felt-deep) 100%);
  border-radius: 22px;
  padding: 3.5%;
  display: grid;
  grid-template-columns: 1fr 1.1fr 1fr;
  grid-template-rows: 1fr 1.1fr 1fr;
  gap: 2.5%;
  box-shadow: 0 14px 34px -14px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.05);
}

/* 座位卡 = 一隻牌 */
.seat {
  position: relative;
  border: none;
  border-radius: 9px;
  padding: .3rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .05rem;
  min-width: 0;
  background: linear-gradient(#FFFFFF 0%, var(--tile) 42%, var(--tile-edge) 100%);
  color: var(--tile-ink);
  box-shadow:
    0 2px 0 0 rgba(0,0,0,.16),
    0 4px 9px -3px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.9);
}
.seat.dealer {
  box-shadow: 0 2px 0 0 rgba(0,0,0,.16), 0 4px 9px -3px rgba(0,0,0,.34),
              inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 2.5px var(--accent);
}
.seat.lands {
  box-shadow: 0 2px 0 0 rgba(0,0,0,.16), 0 4px 9px -3px rgba(0,0,0,.34),
              inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 2.5px var(--gold);
}
.seat .wind {
  font-family: "Songti TC", "Noto Serif TC", serif;
  font-size: clamp(1.1rem, 5.2vw, 1.7rem);
  line-height: 1;
  color: var(--accent);
  text-shadow: 0 1px 0 rgba(255,255,255,.8);
}
.seat .nm {
  font-size: clamp(.68rem, 2.9vw, .84rem);
  font-weight: 600;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  opacity: .82;
}
.seat .amt {
  font-size: clamp(.92rem, 4.3vw, 1.32rem);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.pos { color: var(--accent); }
.neg { color: var(--red); }
.zero { color: var(--muted); }
.seat .tag {
  position: absolute;
  top: .25rem; left: .3rem;
  font-size: .55rem;
  font-weight: 700;
  letter-spacing: .05em;
  padding: .04rem .26rem;
  border-radius: 3px;
  background: var(--accent);
  color: #fff;
}
.seat .lead { position: absolute; top: .2rem; right: .3rem; font-size: .7rem; line-height: 1; }

/* 座位：0=下 1=右 2=上 3=左（逆時針） */
#seat0 { grid-area: 3 / 2; }
#seat1 { grid-area: 2 / 3; }
#seat2 { grid-area: 1 / 2; }
#seat3 { grid-area: 2 / 1; }

.center {
  grid-area: 2 / 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .3rem;
  min-width: 0;
}
.dice { display: flex; gap: .22rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.dice[hidden] { display: none !important; }
.die {
  width: 1.4rem; height: 1.4rem;
  background: #F8F7F2;
  border-radius: 4px;
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  padding: 2px;
  box-shadow: 0 1px 3px rgba(0,0,0,.45);
}
.die i { width: 3.5px; height: 3.5px; border-radius: 50%; background: #1A1A1A; align-self: center; justify-self: center; }
.die[data-v="1"] i:nth-child(1) { grid-area: 2/2; }
.die[data-v="2"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="2"] i:nth-child(2) { grid-area: 3/3; }
.die[data-v="3"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="3"] i:nth-child(2) { grid-area: 2/2; } .die[data-v="3"] i:nth-child(3) { grid-area: 3/3; }
.die[data-v="4"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="4"] i:nth-child(2) { grid-area: 1/3; } .die[data-v="4"] i:nth-child(3) { grid-area: 3/1; } .die[data-v="4"] i:nth-child(4) { grid-area: 3/3; }
.die[data-v="5"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="5"] i:nth-child(2) { grid-area: 1/3; } .die[data-v="5"] i:nth-child(3) { grid-area: 2/2; } .die[data-v="5"] i:nth-child(4) { grid-area: 3/1; } .die[data-v="5"] i:nth-child(5) { grid-area: 3/3; }
.die[data-v="6"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="6"] i:nth-child(2) { grid-area: 1/3; } .die[data-v="6"] i:nth-child(3) { grid-area: 2/1; } .die[data-v="6"] i:nth-child(4) { grid-area: 2/3; } .die[data-v="6"] i:nth-child(5) { grid-area: 3/1; } .die[data-v="6"] i:nth-child(6) { grid-area: 3/3; }
.dice-sum { color: #CFE3D9; font-size: .68rem; font-variant-numeric: tabular-nums; text-align: center; }
.center .hint { color: #7FA294; font-size: .64rem; text-align: center; line-height: 1.45; }

/* ══ 大掣 ══ */
.actions {
  display: flex;
  gap: .5rem;
  padding: 0 calc(.95rem + env(safe-area-inset-right)) .7rem calc(.95rem + env(safe-area-inset-left));
}
.act {
  flex: 1;
  padding: .85rem .5rem;
  min-height: 3rem;
  border-radius: 12px;
  border: 1px solid var(--rule);
  background: var(--surface);
  font-size: .93rem;
  font-weight: 600;
  box-shadow: 0 1px 2px var(--shadow);
}

/* ══ tabs + panels ══ */
.tabs { display: flex; background: var(--surface); border-top: 1px solid var(--rule); }
.tab {
  flex: 1; border: none; background: none; padding: .7rem;
  min-height: 2.75rem;
  color: var(--muted); font-size: .82rem; font-weight: 600;
  border-bottom: 2px solid transparent;
}
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.panel {
  flex: 1 1 auto;
  background: var(--surface);
  overflow-y: auto;
  min-height: 3.5rem;
  /* 底部 home indicator */
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-overflow-scrolling: touch;
}
.panel[hidden] { display: none !important; }

.log-list { list-style: none; margin: 0; padding: 0; }
.log-list li {
  display: grid;
  grid-template-columns: 1.5rem 4.4rem 1fr auto;
  gap: .5rem;
  align-items: baseline;
  padding: .42rem .95rem;
  font-size: .78rem;
  border-bottom: 1px solid var(--rule);
}
.log-list .seq, .log-list .rnd { color: var(--muted); font-variant-numeric: tabular-nums; }
.log-list .rnd { font-size: .71rem; }
.log-list .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
.log-list li.empty { display: block; padding: 1rem .95rem; color: var(--muted); font-size: .8rem; text-align: center; }

#stats { padding: .5rem .95rem .9rem; }
.stat-summary { margin: 0 0 .6rem; font-size: .76rem; color: var(--muted); }
#stats table { width: 100%; border-collapse: collapse; font-size: .76rem; font-variant-numeric: tabular-nums; }
#stats th { text-align: right; font-weight: 600; color: var(--muted); font-size: .67rem; padding: .28rem .22rem; border-bottom: 1px solid var(--rule); }
#stats th:first-child, #stats td:first-child { text-align: left; }
#stats td { text-align: right; padding: .34rem .22rem; border-bottom: 1px solid var(--rule); }
#stats h3 { font-size: .72rem; color: var(--muted); margin: 1rem 0 .25rem; }

/* 直向：等啲仔女直接參與 body 個 flex，唔好多咗一層 */
.side { display: contents; }

/* ══ 打橫用 ══ */
@media (orientation: landscape) and (max-height: 34rem) {
  /* flex-wrap 限制唔到第二行嘅高度，用 grid 先鎖得住 */
  body {
    display: grid;
    grid-template-columns: 52fr 44fr;
    grid-template-rows: auto auto minmax(0, 1fr);
  }
  header { grid-column: 1 / -1; grid-row: 1;
           padding-top: calc(.4rem + env(safe-area-inset-top)); padding-bottom: .35rem; }
  .a2hs { grid-column: 1 / -1; grid-row: 2; }
  main { grid-column: 1; grid-row: 3; }
  .side { grid-column: 2; grid-row: 3; }
  .round-label { font-size: 1.1rem; }
  .a2hs { width: 100%; }
  /* 打橫嗰陣個檯面要由高度決定大細，唔係嘅話會撐爆條 viewport */
  main { min-width: 0; min-height: 0; }
  .felt { height: 100%; width: auto; max-width: 100%; }
  .side { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .actions { padding-top: .45rem; padding-bottom: .45rem; }
  .act { min-height: 2.75rem; padding: .5rem; }
  .panel { min-height: 0; }
}

/* ══ 加到主畫面提示 ══ */
.a2hs {
  display: flex;
  align-items: center;
  gap: .6rem;
  margin: 0;
  padding: .6rem calc(.95rem + env(safe-area-inset-right)) .6rem calc(.95rem + env(safe-area-inset-left));
  background: var(--surface-2);
  border-bottom: 1px solid var(--rule);
  font-size: .76rem;
  color: var(--muted);
  line-height: 1.45;
}
.a2hs[hidden] { display: none !important; }
.a2hs b { color: var(--ink); font-weight: 600; }
.a2hs button {
  margin-left: auto;
  flex-shrink: 0;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 8px;
  padding: .4rem .7rem;
  font-size: .74rem;
  min-height: 2.75rem;
}

/* ══ sheet ══ */
.scrim {
  position: fixed; inset: 0;
  background: rgba(6,16,12,.55);
  display: grid; place-items: end center;
  z-index: 10;
}
.scrim[hidden] { display: none !important; }
.sheet {
  background: var(--bg);
  width: min(100%, 29rem);
  max-height: 92vh;
  overflow-y: auto;
  border-radius: 18px 18px 0 0;
  padding: 1.05rem calc(1rem + env(safe-area-inset-right))
           calc(1.05rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
  overscroll-behavior: contain;
  box-shadow: 0 -10px 34px -12px rgba(0,0,0,.5);
}
.sheet h3 { margin: 0 0 .12rem; font-size: 1.08rem; }
.sheet .sub { margin: 0 0 .85rem; color: var(--muted); font-size: .79rem; line-height: 1.5; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(4.6rem, 1fr)); gap: .5rem; }
.grid.four { grid-template-columns: repeat(4, 1fr); }
.grid.two { grid-template-columns: repeat(2, 1fr); }
.opt {
  padding: .82rem .35rem;
  border-radius: 11px;
  border: 1px solid var(--rule);
  background: var(--surface);
  font-size: .93rem;
  font-weight: 600;
  text-align: center;
  line-height: 1.25;
}
.opt small { display: block; font-weight: 500; font-size: .67rem; color: var(--muted); margin-top: .12rem; font-variant-numeric: tabular-nums; }
.opt.primary { background: var(--accent); color: #fff; border-color: transparent; }
.opt.primary small { color: rgba(255,255,255,.82); }
.opt.tight { padding: .6rem .2rem; font-size: .82rem; min-height: 2.75rem; }
.opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sheet .cancel {
  width: 100%; margin-top: .65rem; padding: .68rem;
  border-radius: 11px; border: 1px solid var(--rule);
  background: var(--surface-2); font-size: .88rem;
}
.field { margin: .85rem 0 0; }
.field > label { display: block; font-size: .72rem; color: var(--muted); margin-bottom: .3rem; font-weight: 600; }
input[type=text], input[type=number] {
  /* 細過 16px 嘅話，iOS 一 focus 就會自動放大成版嘢，好核突 */
  font-size: 16px;
  font-family: inherit;
  width: 100%;
  padding: .6rem .7rem;
  border-radius: 10px;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  -webkit-user-select: text; user-select: text;
}
.row { display: flex; gap: .5rem; margin-top: .75rem; }
.row .opt { flex: 1; }
.anchor { display: flex; gap: .45rem; align-items: center; }
.anchor select, .anchor input {
  font-size: 16px;
  font-family: inherit;
  padding: .6rem .5rem;
  min-height: 2.75rem;
  border-radius: 10px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink);
}
.anchor select { flex: 0 0 6.2rem; }
.anchor input { flex: 1; min-width: 0; }

/* 賠率表 */
.rate-wrap { margin-top: .8rem; border: 1px solid var(--rule); border-radius: 11px; overflow: hidden; background: var(--surface); }
.rate-head { padding: .45rem .7rem; background: var(--surface-2); font-size: .7rem; color: var(--muted); font-weight: 600; }
table.rates { width: 100%; border-collapse: collapse; font-size: .78rem; font-variant-numeric: tabular-nums; }
table.rates th { font-size: .66rem; color: var(--muted); font-weight: 600; padding: .3rem .6rem; text-align: right; border-bottom: 1px solid var(--rule); }
table.rates th:first-child { text-align: left; }
table.rates td { padding: .3rem .6rem; text-align: right; border-bottom: 1px solid var(--rule); }
table.rates td:first-child { text-align: left; font-weight: 600; }
table.rates tr:last-child td { border-bottom: none; }
table.rates tr.anchor-row td { background: rgba(176,138,46,.14); }
.warn-line { margin: .55rem 0 0; font-size: .73rem; color: var(--red); }
.note-line { margin: .55rem 0 0; font-size: .73rem; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: 1.1rem;
  transform: translateX(-50%);
  background: var(--ink); color: var(--bg);
  padding: .52rem .9rem; border-radius: 9px;
  font-size: .81rem; z-index: 20; max-width: 90vw; text-align: center;
}
.toast[hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="round-block">
    <div class="round-label"><span id="roundLabel">東圈東風</span><span class="streak-pill" id="streak" hidden></span></div>
    <div class="round-sub" id="ruleNote"></div>
  </div>
  <div class="icons">
    <button class="icon-btn" id="undo" aria-label="還原上一鋪">↺</button>
    <button class="icon-btn" id="settings" aria-label="設定">⚙</button>
  </div>
</header>

<p class="a2hs" id="a2hs" hidden></p>

<main>
  <div class="felt">
    <button class="seat" id="seat0"></button>
    <button class="seat" id="seat1"></button>
    <button class="seat" id="seat2"></button>
    <button class="seat" id="seat3"></button>
    <div class="center">
      <div class="dice" id="dice" hidden></div>
      <div class="hint" id="centerHint">撳邊個<br>食糊</div>
    </div>
  </div>
</main>

<div class="side">
<div class="actions">
  <button class="act" id="diceBtn">🎲 擲骰</button>
  <button class="act" id="drawBtn">流局</button>
</div>

<nav class="tabs" role="tablist">
  <button class="tab on" data-tab="log" role="tab" aria-selected="true">詳細紀錄</button>
  <button class="tab" data-tab="stats" role="tab" aria-selected="false">統計數據</button>
</nav>

<section class="panel" id="panelLog"><ol class="log-list" id="log"></ol></section>
<section class="panel" id="panelStats" hidden><div id="stats"></div></section>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module">
/* ═══ 計分引擎（由 src/*.ts 自動產生，唔好直接改）═══ */
const __m_types = (() => {

/**

 * 由擲骰者起計 1，數 `count` 個位（逆時針），落喺邊個座位。
 *
 * 擲骰者自己係 1，所以要減一先取模：

function seatFromCount(roller      , count        )       {

    throw new RangeError(`點數要係 1 或以上嘅整數，收到 ${count}`);
  }
  return ((roller + count - 1) % 4)        ;
}

/**
 * 擲骰。
 *
 * `rng` 可以注入，令測試 reproducible；平時就用 Math.random。
 */
function rollDice(
  roller      ,
  count = 3,
  rng               = Math.random,
)           {
  if (!Number.isInteger(count) || count < 1 || count > 5) {
    throw new RangeError(`骰子數目要喺 1 到 5 之間，收到 ${count}`);
  }
  const values = Array.from({ length: count }, () => 1 + Math.floor(rng() * 6));
  const total = values.reduce((a, b) => a + b, 0);

function describeRoll(roll          , dealerSeat      )         {
  const wind = WIND_NAMES[((roll.landsOn - dealerSeat + 4) % 4)                 ];
  return `${roll.values.join(' + ')} = ${roll.total} → ${wind}家`;

function playerStats                    (
  hands           ,
  playerIds            ,
)                {
  return playerIds.map((id) => {
    let played = 0;
    let wins = 0;
    let selfDraws = 0;
    let deals = 0;
    let faanSum = 0;
    let faanCount = 0;
    let biggest = 0;
    let total = 0;

      const seat = hand.seats.indexOf(id)             ;
      if (seat === -1) continue; // 嗰陣未落場
      played++;
      total += hand.deltas[seat] ;
      biggest = Math.max(biggest, hand.deltas[seat] );

          if (ev.from === 'selfDraw') selfDraws++;
          if (typeof ev.score?.faan === 'number') {
            faanSum += ev.score.faan;
            faanCount++;
          }
        } else if (ev.from === seat) {
          deals++;
        }
      }

      id,
      hands: played,
      wins,
      selfDraws,
      deals,
      avgFaan: faanCount > 0 ? faanSum / faanCount : null,
      biggest,
      total,

  });

function dealMatrix   (

  playerIds            ,
)             {

  const matrix = playerIds.map(() => playerIds.map(() => 0));

    for (const ev of hand.events) {

      const dealer = index.get(hand.seats[ev.from] );
      const winner = index.get(hand.seats[ev.winner] );
      if (dealer === undefined || winner === undefined) continue;
      matrix[dealer] [winner] ++;
    }
  }

  {

  let selfDraws = 0;
  let longestStreak = 0;

    longestStreak = Math.max(longestStreak, hand.round.consecutive);

      if (ev.kind === 'win' && ev.from === 'selfDraw') selfDraws++;

const __m_storage = (() => {

/**
 * 儲存同匯出。
 *
 * 存嘅係成條事件序列，唔係分數——分數幾時都可以由事件重新計返出嚟。
 * 一百鋪牌大約 10KB，所以 localStorage 綽綽有餘。
 *
 * 呢度只做「物件 ↔ 字串」，唔掂 localStorage 本身，
 * 咁 Node 度就測試得到，瀏覽器嗰邊包多一層就得。
 */

const SCHEMA = 1;

                           
                 
                  
             
  

function serialize   (session   )         {
  const envelope              = { schema: SCHEMA, savedAt: Date.now(), session };
  return JSON.stringify(envelope);
}

/**
 * 讀返出嚟。
 *
 * 讀唔到（第一次用、資料壞咗、schema 太新）就回 null，
 * 由叫嘅人決定點做——**唔會擲錯**，因為開唔到 app 係最差嘅結果。
 */
function deserialize   (raw               )           {
  if (!raw) return null;
  let parsed         ;
  try {
    parsed = JSON.parse(raw);
  } catch {
    return null;
  }
  if (typeof parsed !== 'object' || parsed === null) return null;

  const env = parsed                        ;
  if (typeof env.schema !== 'number' || env.schema > SCHEMA) return null;
  if (!env.session || typeof env.session !== 'object') return null;

  return env.session;
}

/** 匯出成 CSV，方便攞去 Excel 對數。 */
function toCSV(
  hands   
                
                    
                     
                   
     ,
  nameOf                        ,
)         {
  const rows = [['鋪', '玩家1', '玩家2', '玩家3', '玩家4'].join(',')];
  for (const h of hands) {
    rows.push([
      h.seq,
      ...h.seats.map((id, i) => `${nameOf(id)} ${h.deltas[i]  > 0 ? '+' : ''}${h.deltas[i]}`),
    ].join(','));
  }
  return rows.join('\n');
}

return { serialize, deserialize, toCSV };

    d.setAttribute('aria-label', `${v} 點`);
    for (let i = 0; i < v; i++) d.append(document.createElement('i'));
    box.append(d);
  }
  const sum = document.createElement('span');
  sum.className = 'dice-sum';
  sum.textContent = `${lastRoll.total} → ${nameOf(session.seats[lastRoll.landsOn])}`;
  box.append(sum);
}

function describe(hand) {
  const ev = hand.events[0];
  if (ev.kind === 'draw') return '流局';
  if (ev.kind === 'win') {
    const who = nameOf(hand.seats[ev.winner]);
    const how = ev.from === 'selfDraw' ? '自摸' : `食 ${nameOf(hand.seats[ev.from])}`;
    return `${who} ${how} ${variant().describeScore(ev.score)}`;
  }
  return ev.kind;
}

function renderLog() {
  const ol = $('log');
  ol.innerHTML = '';
  if (session.hands.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '未開始。撳一張牌記低邊個食糊。';
    ol.append(li);
    return;
  }
  for (const hand of [...session.hands].reverse()) {
    const li = document.createElement('li');
    const biggest = hand.deltas.indexOf(Math.max(...hand.deltas));
    const amount = hand.deltas[biggest];
    const seq = document.createElement('span');
    seq.className = 'seq';
    seq.textContent = hand.seq;
    const rnd = document.createElement('span');
    rnd.className = 'rnd';
    rnd.textContent = roundLabel(hand.round);
    const what = document.createElement('span');
    what.textContent = describe(hand);
    const amt = document.createElement('span');
    amt.className = `amt ${cls(amount)}`;
    amt.textContent = amount === 0 ? '—' : fmt(amount);
    li.append(seq, rnd, what, amt);
    ol.append(li);
  }
}

function renderStats() {
  const box = $('stats');
  box.innerHTML = '';
  const ids = session.roster.map((p) => p.id);
  const rows = playerStats(session.hands, ids);
  const overall = sessionStats(session.hands);

  const summary = document.createElement('p');
  summary.className = 'stat-summary';
  summary.textContent = overall.hands === 0
    ? '打多幾鋪就有數睇。'
    : `打咗 ${overall.hands} 鋪　·　流局 ${overall.draws}　·　自摸 ${overall.selfDraws}　·　最長連莊 ${overall.longestStreak}`;
  box.append(summary);
  if (overall.hands === 0) return;

  const table = document.createElement('table');
  table.innerHTML =
    '<thead><tr><th>玩家</th><th>食糊</th><th>自摸</th><th>出銃</th><th>平均</th><th>最大</th><th>總數</th></tr></thead>';
  const tbody = document.createElement('tbody');
  for (const r of [...rows].sort((a, b) => b.total - a.total)) {
    const tr = document.createElement('tr');
    const cells = [
      nameOf(r.id), r.wins, r.selfDraws, r.deals,
      r.avgFaan === null ? '—' : r.avgFaan.toFixed(1),
      r.biggest === 0 ? '—' : `+${r.biggest}`,
      fmt(r.total),
    ];
    cells.forEach((v, i) => {
      const td = document.createElement('td');
      td.textContent = v;
      if (i === 6) td.className = cls(r.total);
      tr.append(td);
    });
    tbody.append(tr);
  }
  table.append(tbody);
  box.append(table);

  const m = dealMatrix(session.hands, ids);
  if (m.flat().some((n) => n > 0)) {
    const h = document.createElement('h3');
    h.textContent = '邊個出銃俾邊個';
    const mt = document.createElement('table');
    const head = ['出銃 ↓ ／ 食糊 →', ...ids.map(nameOf)];
    mt.innerHTML = `<thead><tr>${head.map((t) => `<th>${t}</th>`).join('')}</tr></thead>`;
    const mb = document.createElement('tbody');
    ids.forEach((id, i) => {
      const tr = document.createElement('tr');
      const th = document.createElement('td');
      th.textContent = nameOf(id);
      tr.append(th);
      ids.forEach((_, j) => {
        const td = document.createElement('td');
        td.textContent = i === j ? '—' : m[i][j] || '·';
        if (m[i][j] > 0) td.className = 'neg';
        tr.append(td);
      });
      mb.append(tr);
    });
    mt.append(mb);
    box.append(h, mt);
  }
}

function setTab(next) {
  $('panelLog').hidden = next !== 'log';
  $('panelStats').hidden = next !== 'stats';
  for (const b of document.querySelectorAll('.tab')) {
    b.classList.toggle('on', b.dataset.tab === next);
    b.setAttribute('aria-selected', String(b.dataset.tab === next));
  }
}

/* ── sheet ── */

function closeSheet() {
  $('scrim').hidden = true;
  $('sheet').innerHTML = '';
}

function openSheet(title, sub, build) {
  const sheet = $('sheet');
  sheet.innerHTML = '';
  const h = document.createElement('h3');
  h.textContent = title;
  const p = document.createElement('p');
  p.className = 'sub';
  p.textContent = sub;
  sheet.append(h, p);
  build(sheet);
  const cancel = document.createElement('button');
  cancel.className = 'cancel';
  cancel.textContent = '收埋';
  cancel.onclick = closeSheet;
  sheet.append(cancel);
  $('scrim').hidden = false;
  sheet.scrollTop = 0;
}

function optionButton(label, note, primary) {
  const b = document.createElement('button');
  b.className = `opt${primary ? ' primary' : ''}`;
  b.textContent = label;
  if (note) {
    const s = document.createElement('small');
    s.textContent = note;
    b.append(s);
  }
  return b;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ── 記一鋪牌：撳贏家 → 點食 → 幾多番 ── */

function pickHow(winner) {
  const who = nameOf(session.seats[winner]);
  openSheet(`${who} 食糊`, '點食？', (sheet) => {
    const grid = document.createElement('div');
    grid.className = 'grid';
    const self = optionButton('自摸', '三家各畀', true);
    self.onclick = () => pickScore(winner, 'selfDraw');
    grid.append(self);
    for (let s = 0; s < 4; s++) {
      if (s === winner) continue;
      const b = optionButton(nameOf(session.seats[s]), '出銃');
      b.onclick = () => pickScore(winner, s);
      grid.append(b);
    }
    sheet.append(grid);

    const rename = document.createElement('button');
    rename.className = 'cancel';
    rename.textContent = `改名（${who}）`;
    rename.onclick = () => pickName(winner);
    sheet.append(rename);
  });
}

function pickScore(winner, from) {
  const v = variant();
  const who = nameOf(session.seats[winner]);
  const how = from === 'selfDraw' ? '自摸' : `食 ${nameOf(session.seats[from])}`;
  const options = v.scoreOptions(session.config, { winner, from, round: session.round });

  openSheet(`${who} ${how}`, v.scorePrompt, (sheet) => {
    const grid = document.createElement('div');
    grid.className = 'grid four';
    for (const opt of options) {
      const b = optionButton(opt.label, opt.note);
      if (options.length > 12) b.classList.add('tight');
      b.onclick = () =>
        record([{ kind: 'win', winner, from, score: opt.score }], `${who} ${how} ${opt.label}`);
      grid.append(b);
    }
    sheet.append(grid);
  });
}

function pickName(seat) {
  const pid = session.seats[seat];
  openSheet('改名', `${nameOf(pid)} → ？　改完之前記低嘅牌唔會變。`, (sheet) => {
    const input = document.createElement('input');
    input.type = 'text';
    input.value = nameOf(pid);
    input.maxLength = 12;
    sheet.append(input);
    const row = document.createElement('div');
    row.className = 'row';
    const ok = optionButton('改', null, true);
    const go = () => {
      const name = input.value.trim();
      if (!name) return;
      session = renamePlayer(session, pid, name);
      closeSheet();
      render();
      toast(`改咗名做「${name}」，歷史數字冇變`);
    };
    ok.onclick = go;
    input.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    row.append(ok);
    sheet.append(row);
    setTimeout(() => input.focus(), 50);
  });
}

  lastRoll = rollDice(roller, session.diceCount);

/**
 * 玩法同賠率編輯器。
 *
 * 重點喺「大細」嗰行：唔係叫人填基數（冇人心目中係諗基數），
 * 而係揀一個番數講「呢個番數打幾大」，其餘成張表按級距自動跳。
 * 跳完即刻 render 返成張表——除唔盡會有出入，一定要俾人見到。
 */
function openRuleEditor() {
  let draft = { ...session.config };
  let presetName = session.presetName;
  let anchorFaan = Math.min(draft.maxFaan, Math.max(draft.minFaan, draft.maxFaan));

  function build() {
    openSheet('玩法同賠率', '揀個現成玩法，或者自己調。改咗即刻見到成張賠率表。', (sheet) => {
      const markCustom = () => { presetName = CUSTOM; };

      // ── 現成玩法 ──
      const presetField = document.createElement('div');
      presetField.className = 'field';
      presetField.innerHTML = '<label>現成玩法</label>';
      const presetGrid = document.createElement('div');
      presetGrid.className = 'grid two';
      for (const [name, cfg] of Object.entries(variant().presets)) {
        const b = optionButton(name, null);
        b.classList.add('tight');
        if (presetName === name) b.classList.add('on');
        b.onclick = () => {
          draft = { ...cfg };
          presetName = name;
          anchorFaan = draft.maxFaan;
          build();
        };
        presetGrid.append(b);
      }
      presetField.append(presetGrid);
      sheet.append(presetField);

      // ── 逐項調 ──
      const chooser = (label, values, current, onPick, fmtLabel = String) => {
        const wrap = document.createElement('div');
        wrap.className = 'field';
        wrap.innerHTML = `<label>${label}</label>`;
        const g = document.createElement('div');
        g.className = 'grid';
        for (const v of values) {
          const b = optionButton(fmtLabel(v), null);
          b.classList.add('tight');
          if (v === current) b.classList.add('on');
          b.onclick = () => { onPick(v); markCustom(); build(); };
          g.append(b);
        }
        wrap.append(g);
        sheet.append(wrap);
      };

      chooser('起糊番數', [1, 2, 3, 4, 5], draft.minFaan, (v) => {
        draft.minFaan = v;
        if (draft.maxFaan < v) draft.maxFaan = v;
        if (anchorFaan < v || anchorFaan > draft.maxFaan) anchorFaan = draft.maxFaan;
      }, (v) => `${v}番`);

      chooser('封頂番數', MAX_FAAN_CHOICES, draft.maxFaan, (v) => {
        draft.maxFaan = v;
        if (anchorFaan > v) anchorFaan = v;
      }, (v) => `${v}番`);

      chooser('級距', ['half', 'full'], draft.scale,
        (v) => { draft.scale = v; },
        (v) => (v === 'half' ? '半辣上' : '辣辣上'));

      chooser('找數', ['full', 'half'], draft.liability,
        (v) => { draft.liability = v; },
        (v) => (v === 'full' ? '全銃' : '半銃'));

      // ── 大細 ──
      const problem = validateConfig(draft);
      const stake = document.createElement('div');
      stake.className = 'field';
      stake.innerHTML = '<label>大細　—　揀一個番數，話我知佢個基數幾多</label>';

      if (!problem) {
        const anchorRow = document.createElement('div');
        anchorRow.className = 'anchor';

        const sel = document.createElement('select');
        sel.setAttribute('aria-label', '用邊個番數做基準');
        for (let f = draft.minFaan; f <= draft.maxFaan; f++) {
          const o = document.createElement('option');
          o.value = String(f);
          o.textContent = `${f}番`;
          if (f === anchorFaan) o.selected = true;
          sel.append(o);
        }
        const amountInput = document.createElement('input');
        amountInput.type = 'number';
        amountInput.min = '1';
        amountInput.inputMode = 'numeric';
        amountInput.setAttribute('aria-label', '打幾大');
        amountInput.value = String(unitFor(anchorFaan, draft));

        const apply = () => {
          const amount = Number(amountInput.value);
          if (!Number.isFinite(amount) || amount <= 0) return;
          try {
            draft.base = baseForAnchor(anchorFaan, amount, draft);
            markCustom();
            build();
          } catch { /* 輸入未完整，唔好嘈 */ }
        };
        sel.onchange = () => { anchorFaan = Number(sel.value); build(); };
        amountInput.onchange = apply;
        amountInput.onkeydown = (e) => { if (e.key === 'Enter') apply(); };

        anchorRow.append(sel, amountInput);
        stake.append(anchorRow);

        const quick = document.createElement('div');
        quick.className = 'row';
        const half = optionButton('細一半', null);
        const dbl = optionButton('大一倍', null);
        half.classList.add('tight');
        dbl.classList.add('tight');
        half.onclick = () => { draft.base = Math.max(1, Math.round(draft.base / 2)); markCustom(); build(); };
        dbl.onclick = () => { draft.base *= 2; markCustom(); build(); };
        quick.append(half, dbl);
        stake.append(quick);
      }
      sheet.append(stake);

      // ── 賠率表 ──
      if (problem) {
        const w = document.createElement('p');
        w.className = 'warn-line';
        w.textContent = problem;
        sheet.append(w);
      } else {
        const wrap = document.createElement('div');
        wrap.className = 'rate-wrap';
        const head = document.createElement('div');
        head.className = 'rate-head';
        head.textContent = '賠率表';
        const t = document.createElement('table');
        t.className = 'rates';
        t.innerHTML = '<thead><tr><th>番數</th><th>基數</th><th>出銃收</th><th>自摸收</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const { faan, unit } of unitTable(draft)) {
          const tr = document.createElement('tr');
          if (faan === anchorFaan) tr.className = 'anchor-row';
          for (const text of [`${faan}番`, String(unit), String(4 * unit), String(6 * unit)]) {
            const td = document.createElement('td');
            td.textContent = text;
            tr.append(td);
          }
          tb.append(tr);
        }
        t.append(tb);
        wrap.append(head, t);
        sheet.append(wrap);

        const note = document.createElement('p');
        note.className = 'note-line';
        note.textContent = draft.liability === 'full'
          ? '全銃：出銃者一人畀晒。自摸三家各畀一份。'
          : '半銃：出銃者畀雙份，其餘兩家各一份。自摸三家各畀一份。';
        sheet.append(note);
      }

      // ── 用呢個 ──
      const row = document.createElement('div');
      row.className = 'row';
      const started = session.hands.length > 0;
      const ok = optionButton(
        started ? '用呢個開新牌局' : '就用呢個',
        started ? '而家啲分會清零' : null,
        true,
      );
      if (problem) { ok.disabled = true; ok.style.opacity = '.45'; }
      ok.onclick = () => {
        if (problem) return;
        const keep = session.roster;
        const seats = session.seats;
        session = newSession(presetName, session.diceCount, { ...draft });
        session.presetName = presetName;
        session.roster = keep;
        session.seats = seats;
        lastRoll = null;
        closeSheet();
        render();
        toast(`開咗新牌局：${presetName}`);
      };
      row.append(ok);
      sheet.append(row);
    });
  }

  build();
}

function pickSwap() {
  openSheet('換位', '揀兩個位對調。之前記低嘅牌會保留原本嘅座位。', (sheet) => {
    const chosen = [];
    const grid = document.createElement('div');
    grid.className = 'grid two';
    for (let s = 0; s < 4; s++) {
      const seat = s;
      const b = optionButton(nameOf(session.seats[seat]), `${WIND_NAMES[playerWind(seat, session.round)]}家`);
      b.onclick = () => {
        if (chosen.includes(seat)) return;
        chosen.push(seat);
        b.classList.add('primary');
        if (chosen.length === 2) {
          session = swapSeats(session, chosen[0], chosen[1]);
          lastRoll = null;
          closeSheet();
          render();
          toast('換咗位');
        }
      };
      grid.append(b);
    }
    sheet.append(grid);
  });
}

function pickSubstitute() {
  openSheet('換人', '邊個走？之前佢打嗰幾鋪嘅數會凍結，唔會跟住新人走。', (sheet) => {
    const grid = document.createElement('div');
    grid.className = 'grid two';
    for (let s = 0; s < 4; s++) {
      const seat = s;
      const b = optionButton(nameOf(session.seats[seat]), `${WIND_NAMES[playerWind(seat, session.round)]}家`);
      b.onclick = () => pickSubstituteName(seat);
      grid.append(b);
    }
    sheet.append(grid);
  });
}

function pickSubstituteName(seat) {
  const outgoing = nameOf(session.seats[seat]);
  openSheet('換人', `${outgoing} 走咗，邊個頂上？`, (sheet) => {
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '新玩家個名';
    input.maxLength = 12;
    sheet.append(input);
    const row = document.createElement('div');
    row.className = 'row';
    const ok = optionButton('頂上', null, true);
    const go = () => {
      const name = input.value.trim();
      if (!name) return;
      // 新 id，唔會同走咗嗰個撈亂——所以兩個人嘅統計分得開
      const id = `p${Date.now().toString(36)}`;
      session = substitutePlayer(session, seat, { id, name });
      lastRoll = null;
      closeSheet();
      render();
      toast(`${name} 頂咗 ${outgoing}，${outgoing} 之前嘅數凍結咗`);
    };
    ok.onclick = go;
    input.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    row.append(ok);
    sheet.append(row);
    setTimeout(() => input.focus(), 50);
  });
}

function pickRound() {
  openSheet('莊家設定', '記漏咗或者搞錯咗？直接跳去啱嘅圈同局。', (sheet) => {
    const grid = document.createElement('div');
    grid.className = 'grid four';
    for (let pw = 0; pw < 4; pw++) {
      for (let hw = 0; hw < 4; hw++) {
        const b = optionButton(`${WIND_NAMES[pw]}圈${WIND_NAMES[hw]}風`, null);
        b.classList.add('tight');
        b.onclick = () => {
          session = { ...session, round: setRound(session.round, { prevailingWind: pw, handWind: hw }) };
          lastRoll = null;
          closeSheet();
          render();
          toast(`跳咗去 ${roundLabel(session.round)}`);
        };
        grid.append(b);
      }
    }
    sheet.append(grid);
  });
}

function confirmReset() {
  openSheet('新牌局', '而家嘅分數同紀錄會冇晒。玩法、名同座位會保留。', (sheet) => {
    const row = document.createElement('div');
    row.className = 'row';
    const ok = optionButton('開新牌局', null, true);
    ok.onclick = () => {
      const keep = session.roster;
      const seats = session.seats;
      const name = session.presetName;
      session = newSession(name, session.diceCount, { ...session.config });
      session.presetName = name;
      session.roster = keep;
      session.seats = seats;
      lastRoll = null;
      closeSheet();
      render();
      toast('開咗新牌局');
    };
    row.append(ok);
    sheet.append(row);
  });
}

function exportCSV() {
  const csv = toCSV(session.hands, nameOf);
  closeSheet();
  if (!csv.includes('\n')) {
    toast('未有牌可以匯出');
    return;
  }
  navigator.clipboard?.writeText(csv).then(
    () => toast('已經 copy 咗去剪貼簿'),
    () => toast('copy 唔到，請自己 select 個紀錄'),
  );
}

/* ── 落數 ── */

function record(events, label) {
  try {
    session = appendHand(session, events, variant().settle);
    lastRoll = null;
    closeSheet();
    render();
    toast(label);
  } catch (err) {
    toast(`記唔到：${err.message}`);
  }
}

/* ── 綁 ── */

for (let seat = 0; seat < 4; seat++) {
  $(`seat${seat}`).onclick = () => pickHow(seat);
}

$('drawBtn').onclick = () => record([{ kind: 'draw' }], '流局');
$('diceBtn').onclick = throwDice;
$('settings').onclick = openSettings;

$('undo').onclick = () => {
  const last = session.hands[session.hands.length - 1];
  if (!last) return;
  const label = describe(last);
  session = undoLastHand(session);
  lastRoll = null;
  render();
  toast(`還原咗：${label}`);
};

$('scrim').onclick = (e) => { if (e.target === $('scrim')) closeSheet(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

for (const b of document.querySelectorAll('.tab')) {
  b.onclick = () => setTab(b.dataset.tab);
}

/* ── 加到主畫面 ──
   Android/Chrome 會自己彈 install prompt；iOS 冇，要人手教。
   兩邊都係喺 http(s) 先有意思——直接開個檔案唔使裝。 */
function setupInstallHint() {
  const bar = $('a2hs');
  if (!bar) return;
  const DISMISSED = 'mahjong.a2hs.dismissed';
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  let dismissed = false;
  try { dismissed = localStorage.getItem(DISMISSED) === '1'; } catch { /* 私隱模式 */ }
  if (standalone || dismissed || !location.protocol.startsWith('http')) return;

  // navigator.standalone 淨係 Safari 有——用嚟分開「真 iPad」同「有觸控嘅 Mac」
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1 && 'standalone' in navigator);
  let deferred = null;

  const show = (html) => {
    bar.innerHTML = '';
    const text = document.createElement('span');
    text.innerHTML = html;
    const close = document.createElement('button');
    close.textContent = '唔使';
    close.onclick = () => {
      bar.hidden = true;
      try { localStorage.setItem(DISMISSED, '1'); } catch { /* 算 */ }
    };
    bar.append(text, close);
    bar.hidden = false;
  };

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    show('<b>加到主畫面</b>　用起上嚟同 app 一樣，離線都得。');
    const add = document.createElement('button');
    add.textContent = '加';
    add.onclick = async () => {
      bar.hidden = true;
      deferred.prompt();
      await deferred.userChoice;
      deferred = null;
    };
    bar.insertBefore(add, bar.lastChild);
  });

  if (isIOS) {
    show('<b>加到主畫面</b>　撳底下個「分享」掣 → 加至主畫面，之後開起上嚟就冇咗個網址列。');
  }
}
setupInstallHint();

/* 放上網之後可以離線用。file:// 開嗰陣冇 service worker，
   但嗰陣個檔案本身已經喺部機度，一樣離線行到。 */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* 打牌時個 mon 熄咗要重新撳，好煩 */
if ('wakeLock' in navigator) {
  const keepAwake = () => navigator.wakeLock.request('screen').catch(() => {});
  keepAwake();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
  });
}

/* ── 開波 ── */
session = load() ?? newSession(firstPreset());
setTab('log');
render();
if (session.hands.length > 0) toast(`接返上次：打咗 ${session.hands.length} 鋪`);

</script>
</body>
</html>
