<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS 加到主畫面之後就沒有 Safari 的工具列，像真正的 app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雀數">
<!-- iOS 不接受 SVG 當主畫面 icon，一定要 PNG -->
<link rel="apple-touch-icon" href="icon-180.png">
<!-- 未公開：不想被 Google 索引。想公開時刪掉這一行。 -->
<meta name="robots" content="noindex, nofollow">
<title>雀數 · 打麻雀記分</title>
<meta name="theme-color" content="#12483A">
<!-- 只有在 server 上執行時才用得到；直接雙擊開啟檔案本身已經離線可用 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root {
  --bg:        #E9EDE6;
  --felt:      #12483A;
  --felt-deep: #0C3529;
  --tile:      #FBF9F3;
  --tile-edge: #DAD5C6;
  --tile-ink:  #1A2420;
  --surface:   #FFFFFF;
  --surface-2: #EFF2EC;
  --ink:       #16211C;
  --muted:     #64756C;
  --accent:    #14624E;
  --gold:      #B08A2E;
  --red:       #A5382B;
  --rule:      #D6DDD3;
  --shadow:    rgba(16, 30, 24, .16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0A120F;
    --felt:      #10382C;
    --felt-deep: #08241C;
    --tile:      #EDEAE0;
    --tile-edge: #B9B4A4;
    --tile-ink:  #17201C;
    --surface:   #141F1A;
    --surface-2: #1B2822;
    --ink:       #E7EEE9;
    --muted:     #8CA298;
    --accent:    #4FBB9A;
    --gold:      #D9B45A;
    --red:       #E2796C;
    --rule:      #24332D;
    --shadow:    rgba(0, 0, 0, .55);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html {
  height: 100%;
  /* 手機轉橫時不要自己放大字 */
  -webkit-text-size-adjust: 100%;
  /* 不要下拉刷新／不要彈跳——打牌打到一半 reload 就麻煩了 */
  overscroll-behavior: none;
}
body {
  /* 100vh 在 iOS Safari 會算入工具列，撞到底部，所以用 svh 做最低高度。
     用 min-height 不用 height：紀錄變多時要讓整頁可以延伸，而不是鎖死在一個
     螢幕高度——之前鎖死過，紀錄能顯示的空間很少，還 scroll 不到上面看。 */
  min-height: 100vh;
  min-height: 100svh;
  overscroll-behavior-y: none; /* 只擋下拉刷新，不擋正常 scroll */
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Segoe UI", system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; cursor: pointer; color: inherit; transition: scale .1s cubic-bezier(0.2, 0, 0, 1); }
button:active:not(:disabled) { scale: 0.96; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ══ header：局面做主角 ══ */
header {
  display: flex;
  align-items: center;
  gap: .7rem;
  /* 瀏海／動態島底下不可以放東西 */
  padding: calc(.75rem + env(safe-area-inset-top)) calc(.95rem + env(safe-area-inset-right))
           .6rem calc(.95rem + env(safe-area-inset-left));
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.round-block { flex: 1; min-width: 0; }
.round-label {
  font-family: "Songti TC", "Noto Serif TC", serif;
  font-size: 1.32rem;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: .02em;
}
.round-sub {
  font-size: .69rem;
  color: var(--muted);
  margin-top: .12rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.streak-pill {
  display: inline-block;
  background: var(--gold);
  color: #fff;
  font-size: .62rem;
  font-weight: 600;
  padding: .06rem .34rem;
  border-radius: 3px;
  margin-left: .35rem;
  vertical-align: 2px;
}
.streak-pill[hidden] { display: none !important; }
.icons { display: flex; gap: .3rem; flex-shrink: 0; }
.icon-btn {
  /* Apple HIG：可點的東西最小 44×44 */
  width: 2.75rem; height: 2.75rem;
  border: 1px solid var(--rule);
  background: var(--surface-2);
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: .96rem;
}
.icon-btn:disabled { opacity: .33; }

/* ══ 檯面 ══ */
main {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  padding: .5rem calc(.7rem + env(safe-area-inset-right)) .5rem calc(.7rem + env(safe-area-inset-left));
  min-height: 0;
}
.felt {
  width: min(100%, 30rem, 100%);
  aspect-ratio: 1;
  max-height: 100%;
  background: radial-gradient(ellipse at 50% 42%, var(--felt) 0%, var(--felt-deep) 100%);
  border-radius: 22px;
  padding: 3.5%;
  display: grid;
  grid-template-columns: 1fr 1.1fr 1fr;
  grid-template-rows: 1fr 1.1fr 1fr;
  gap: 2.5%;
  box-shadow: 0 14px 34px -14px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.05);
}

/* 座位卡 = 一隻牌 */
.seat {
  position: relative;
  border: none;
  border-radius: 9px;
  padding: .3rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .05rem;
  min-width: 0;
  background: linear-gradient(#FFFFFF 0%, var(--tile) 42%, var(--tile-edge) 100%);
  color: var(--tile-ink);
  box-shadow:
    0 2px 0 0 rgba(0,0,0,.16),
    0 4px 9px -3px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.9);
}
.seat.dealer {
  box-shadow: 0 2px 0 0 rgba(0,0,0,.16), 0 4px 9px -3px rgba(0,0,0,.34),
              inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 2.5px var(--accent);
}
.seat.lands {
  box-shadow: 0 2px 0 0 rgba(0,0,0,.16), 0 4px 9px -3px rgba(0,0,0,.34),
              inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 2.5px var(--gold);
}
.seat .wind {
  font-family: "Songti TC", "Noto Serif TC", serif;
  font-size: clamp(1.1rem, 5.2vw, 1.7rem);
  line-height: 1;
  color: var(--accent);
  text-shadow: 0 1px 0 rgba(255,255,255,.8);
}
.seat .nm {
  font-size: clamp(.68rem, 2.9vw, .84rem);
  font-weight: 600;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  opacity: .82;
}
.seat .amt {
  font-size: clamp(.92rem, 4.3vw, 1.32rem);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.pos { color: var(--accent); }
.neg { color: var(--red); }
.zero { color: var(--muted); }
.seat .tag {
  position: absolute;
  top: .25rem; left: .3rem;
  font-size: .55rem;
  font-weight: 700;
  letter-spacing: .05em;
  padding: .04rem .26rem;
  border-radius: 3px;
  background: var(--accent);
  color: #fff;
}
.seat .lead { position: absolute; top: .2rem; right: .3rem; font-size: .7rem; line-height: 1; }

/* 座位：0=下 1=右 2=上 3=左（逆時針） */
#seat0 { grid-area: 3 / 2; }
#seat1 { grid-area: 2 / 3; }
#seat2 { grid-area: 1 / 2; }
#seat3 { grid-area: 2 / 1; }

.center {
  grid-area: 2 / 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .3rem;
  min-width: 0;
}
.dice { display: flex; gap: .22rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.dice[hidden] { display: none !important; }
.die {
  width: 1.4rem; height: 1.4rem;
  background: #F8F7F2;
  border-radius: 4px;
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  padding: 2px;
  box-shadow: 0 1px 3px rgba(0,0,0,.45);
}
.die i { width: 3.5px; height: 3.5px; border-radius: 50%; background: #1A1A1A; align-self: center; justify-self: center; }
.die[data-v="1"] i:nth-child(1) { grid-area: 2/2; }
.die[data-v="2"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="2"] i:nth-child(2) { grid-area: 3/3; }
.die[data-v="3"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="3"] i:nth-child(2) { grid-area: 2/2; } .die[data-v="3"] i:nth-child(3) { grid-area: 3/3; }
.die[data-v="4"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="4"] i:nth-child(2) { grid-area: 1/3; } .die[data-v="4"] i:nth-child(3) { grid-area: 3/1; } .die[data-v="4"] i:nth-child(4) { grid-area: 3/3; }
.die[data-v="5"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="5"] i:nth-child(2) { grid-area: 1/3; } .die[data-v="5"] i:nth-child(3) { grid-area: 2/2; } .die[data-v="5"] i:nth-child(4) { grid-area: 3/1; } .die[data-v="5"] i:nth-child(5) { grid-area: 3/3; }
.die[data-v="6"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="6"] i:nth-child(2) { grid-area: 1/3; } .die[data-v="6"] i:nth-child(3) { grid-area: 2/1; } .die[data-v="6"] i:nth-child(4) { grid-area: 2/3; } .die[data-v="6"] i:nth-child(5) { grid-area: 3/1; } .die[data-v="6"] i:nth-child(6) { grid-area: 3/3; }
.dice-sum { color: #CFE3D9; font-size: .68rem; font-variant-numeric: tabular-nums; text-align: center; }
.center .hint { color: #7FA294; font-size: .64rem; text-align: center; line-height: 1.45; }

/* ══ 大掣 ══ */
.actions {
  display: flex;
  gap: .5rem;
  padding: 0 calc(.95rem + env(safe-area-inset-right)) .7rem calc(.95rem + env(safe-area-inset-left));
}
.act {
  flex: 1;
  padding: .85rem .5rem;
  min-height: 3rem;
  border-radius: 12px;
  border: none;
  background: var(--surface);
  font-size: .93rem;
  font-weight: 600;
  /* 邊框用 box-shadow 做（0 blur 的 ring），只是為了跟下面那層深度陰影同屬
     一套系統，不用 border + shadow 兩樣一起做「讓按鈕看起來浮起」這件事 */
  box-shadow: 0 0 0 1px var(--rule), 0 1px 2px var(--shadow);
}

/* ══ tabs + panels ══ */
.tabs {
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  /* 整頁往下 scroll 時黏在頂端，隨時可以換 tab；加一點頂部邊距
     頂住瀏海／狀態列，因為這排按鈕有機會黏到最頂。 */
  position: sticky;
  top: 0;
  padding-top: env(safe-area-inset-top);
  z-index: 5;
}
.tab {
  flex: 1; border: none; background: none; padding: .7rem;
  min-height: 2.75rem;
  color: var(--muted); font-size: .82rem; font-weight: 600;
  border-bottom: 2px solid transparent;
}
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.panel {
  background: var(--surface);
  /* 不再靠「剩下多少空間」來決定紀錄有多少空間——固定一個 screen 高，
     紀錄少也不會太擠，紀錄多就整頁自然拉長，往下 scroll 就能看完。 */
  min-height: 60svh;
  padding-bottom: calc(1rem + env(safe-area-inset-bottom));
}
.panel[hidden] { display: none !important; }

/* ── 詳細紀錄：工具列（看哪一種、排序方式） ── */
.log-toolbar {
  display: flex;
  gap: .5rem;
  padding: .55rem .95rem;
  flex-wrap: wrap;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
/* class 的 display:flex specificity 贏過 [hidden] 的 UA 預設，要自己補一條才能真的隱藏
   ——和 .panel[hidden] / .dice[hidden] 是同一個坑。 */
.log-toolbar[hidden] { display: none !important; }
.seg { display: flex; background: var(--surface-2); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button {
  border: none; background: transparent; padding: .34rem .62rem; border-radius: 7px;
  font-size: .74rem; font-weight: 600; color: var(--muted); min-height: 1.9rem;
}
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }

.log-list { list-style: none; margin: 0; padding: 0; }
.log-list li {
  display: grid;
  grid-template-columns: 1.5rem 4.4rem 1fr auto;
  gap: .5rem;
  align-items: baseline;
  padding: .42rem .95rem;
  font-size: .78rem;
  border-bottom: 1px solid var(--rule);
}
.log-list .seq, .log-list .rnd { color: var(--muted); font-variant-numeric: tabular-nums; }
.log-list .rnd { font-size: .71rem; }
.log-list .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
.log-list li.empty { display: block; padding: 1rem .95rem; color: var(--muted); font-size: .8rem; text-align: center; }

/* 「分數」view：一鋪一橫排，四個位各自的這鋪／累計 */
.log-list li.score-row {
  display: block;
  padding: .5rem .95rem;
}
.score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .3rem; text-align: center; }
.score-grid .cell .delta { font-size: .84rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.score-grid .cell .cum { font-size: .67rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: .05rem; }
.score-grid .cell .delta.zero, .score-grid .cell .cum { color: var(--muted); }
.score-meta {
  display: flex; justify-content: space-between; gap: .5rem;
  font-size: .68rem; color: var(--muted); margin-bottom: .3rem;
}
.score-legend {
  /* 沒有做 sticky——和 tabs 疊在一起要算安全區高度，在不同機型會對不準位置。
     只讓 tabs sticky 就已經夠用（隨時可以換 tab），這個 legend 就跟著一起 scroll 走。 */
  display: grid; grid-template-columns: repeat(4, 1fr); gap: .3rem;
  padding: .5rem .95rem; font-size: .68rem; color: var(--muted); text-align: center;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.log-list li.round-divider {
  /* .log-list li 的 grid（class+element，specificity 贏過單一個 class）
     會把這個只有一段文字的 <li> 擠進第一格 1.5rem 寬，中文沒有字距
     就逐字換行——和之前 empty-state 的坑一樣，要用 display:block 蓋掉。 */
  display: block;
  padding: .4rem .95rem;
  font-size: .68rem; font-weight: 700; color: var(--accent);
  background: var(--surface-2); letter-spacing: .03em;
}

/* ── 統計數據：卡片 ── */
#stats { padding: .5rem .95rem .9rem; }
.stat-summary { margin: 0 0 .6rem; font-size: .76rem; color: var(--muted); }
.stat-top { display: flex; justify-content: flex-end; margin-bottom: .5rem; }
.stat-top button {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 9px;
  padding: .4rem .7rem; font-size: .78rem; font-weight: 600; min-height: 2.4rem;
}
.stat-cards { display: flex; flex-direction: column; gap: .6rem; }
.stat-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: .75rem .9rem; }
.stat-card-head { display: flex; align-items: center; gap: .5rem; }
.stat-avatar { font-size: 1.3rem; line-height: 1; }
.stat-rank { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.stat-name {
  font-weight: 700; font-size: .92rem; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.stat-badge {
  font-size: .68rem; font-weight: 600; padding: .22rem .58rem; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); white-space: nowrap; flex-shrink: 0;
}
.stat-badge.top { background: rgba(176,138,46,.18); color: var(--gold); }
.stat-badge.roast { background: rgba(165,56,43,.14); color: var(--red); }
.stat-card-body {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem;
  margin-top: .6rem; padding-top: .6rem; border-top: 1px solid var(--rule);
}
.stat-cell { text-align: center; position: relative; }
.stat-cell .n { font-size: 1.18rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-cell .lbl { font-size: .68rem; color: var(--muted); margin-top: .1rem; }
.stat-crown { position: absolute; top: -1.1rem; left: 50%; transform: translateX(-50%); font-size: .8rem; }

#stats table { width: 100%; border-collapse: collapse; font-size: .76rem; font-variant-numeric: tabular-nums; }
#stats th { text-align: right; font-weight: 600; color: var(--muted); font-size: .67rem; padding: .28rem .22rem; border-bottom: 1px solid var(--rule); }
#stats th:first-child, #stats td:first-child { text-align: left; }
#stats td { text-align: right; padding: .34rem .22rem; border-bottom: 1px solid var(--rule); }
#stats h3 { font-size: .72rem; color: var(--muted); margin: 1rem 0 .25rem; }

/* 直向：讓子元素直接參與 body 的 flex，不要多一層 */
.side { display: contents; }

/* ══ 打橫用 ══ */
@media (orientation: landscape) and (max-height: 34rem) {
  /* 橫向時螢幕矮，整頁 scroll 反而不適用——照樣鎖死一個 screen，
     紀錄靠 .panel 自己那塊 scroll。flex-wrap 限制不到第二行的高度，
     所以要用 grid 才鎖得住。 */
  body {
    display: grid;
    grid-template-columns: 52fr 44fr;
    grid-template-rows: auto auto minmax(0, 1fr);
    min-height: 100svh;
    height: 100svh;
    overflow: hidden;
  }
  .tabs { position: static; padding-top: 0; }
  header { grid-column: 1 / -1; grid-row: 1;
           padding-top: calc(.4rem + env(safe-area-inset-top)); padding-bottom: .35rem; }
  .a2hs { grid-column: 1 / -1; grid-row: 2; }
  main { grid-column: 1; grid-row: 3; }
  .side { grid-column: 2; grid-row: 3; }
  .round-label { font-size: 1.1rem; }
  .a2hs { width: 100%; }
  /* 橫向時牌桌要由高度決定大小，否則會撐爆 viewport */
  main { min-width: 0; min-height: 0; }
  .felt { height: 100%; width: auto; max-width: 100%; }
  .side { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .actions { padding-top: .45rem; padding-bottom: .45rem; }
  .act { min-height: 2.75rem; padding: .5rem; }
  .panel {
    flex: 1 1 auto;
    min-height: 0;
    max-height: none;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
}

/* ══ 加到主畫面提示 ══ */
.a2hs {
  display: flex;
  align-items: center;
  gap: .6rem;
  margin: 0;
  padding: .6rem calc(.95rem + env(safe-area-inset-right)) .6rem calc(.95rem + env(safe-area-inset-left));
  background: var(--surface-2);
  border-bottom: 1px solid var(--rule);
  font-size: .76rem;
  color: var(--muted);
  line-height: 1.45;
}
.a2hs[hidden] { display: none !important; }
.a2hs b { color: var(--ink); font-weight: 600; }
.a2hs button {
  margin-left: auto;
  flex-shrink: 0;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 8px;
  padding: .4rem .7rem;
  font-size: .74rem;
  min-height: 2.75rem;
}

/* ══ sheet ══ */
.scrim {
  position: fixed; inset: 0;
  background: rgba(6,16,12,.55);
  display: grid; place-items: end center;
  z-index: 10;
  opacity: 0;
  transition: opacity .2s cubic-bezier(0.2, 0, 0, 1);
}
.scrim[hidden] { display: none !important; }
.scrim.open { opacity: 1; }
.sheet {
  background: var(--bg);
  width: min(100%, 29rem);
  max-height: 92vh;
  overflow-y: auto;
  border-radius: 18px 18px 0 0;

const __m_storage = (() => {

/**
 * 儲存與匯出。
 *
 * 儲存的是整條事件序列，而不是分數——分數隨時都可以由事件重新計算出來。
 * 一百鋪牌大約 10KB，因此 localStorage 綽綽有餘。
 *
 * 這裡只處理「物件 ↔ 字串」的轉換，不涉及 localStorage 本身，
 * 這樣在 Node 環境就能測試，瀏覽器那邊再包一層即可。
 */

const SCHEMA = 1;

                           
                 
                  
             
  

function serialize   (session   )         {
  const envelope              = { schema: SCHEMA, savedAt: Date.now(), session };
  return JSON.stringify(envelope);
}

/**
 * 讀取回來。
 *
 * 讀取不到（首次使用、資料損毀、schema 版本太新）就回傳 null，
 * 交由呼叫方決定如何處理——**不會拋出例外**，因為打不開 app 是最差的結果。
 */
function deserialize   (raw               )           {
  if (!raw) return null;
  let parsed         ;
  try {
    parsed = JSON.parse(raw);
  } catch {
    return null;
  }
  if (typeof parsed !== 'object' || parsed === null) return null;

  const env = parsed                        ;
  if (typeof env.schema !== 'number' || env.schema > SCHEMA) return null;
  if (!env.session || typeof env.session !== 'object') return null;

  return env.session;
}

/** 匯出成 CSV，方便拿到 Excel 對帳。 */
function toCSV(
  hands   
                
                    
                     
                   
     ,
  nameOf                        ,
)         {
  const rows = [['鋪', '玩家1', '玩家2', '玩家3', '玩家4'].join(',')];
  for (const h of hands) {
    rows.push([
      h.seq,
      ...h.seats.map((id, i) => `${nameOf(id)} ${h.deltas[i]  > 0 ? '+' : ''}${h.deltas[i]}`),
    ].join(','));
  }
  return rows.join('\n');
}

return { serialize, deserialize, toCSV };

  if (ev.kind === 'draw') return '流局';

  if (ev.kind === 'win') {

  grid.className = 'score-grid';
  ids.forEach((id, i) => {
    const delta = playerDeltaInHand(hand, id);
    const cell = document.createElement('div');
    cell.className = 'cell';
    const d = document.createElement('div');
    d.className = `delta ${delta === null ? 'zero' : cls(delta)}`;
    d.textContent = delta === null ? '·' : fmt(delta);
    const c = document.createElement('div');
    c.className = 'cum';
    c.textContent = delta === null ? '' : fmt(cumRow[i]);
    cell.append(d, c);
    grid.append(cell);
  });
  li.append(grid);
  return li;
}

function renderLog() {
  const ol = $('log');
  const toolbar = $('logToolbar');
  toolbar.innerHTML = '';
  ol.innerHTML = '';

  if (session.hands.length === 0) {
    toolbar.hidden = true;
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '尚未開始。點選一張座位牌，記錄哪位食糊。';
    ol.append(li);
    return;
  }
  toolbar.hidden = false;

  toolbar.append(
    segControl([['event', '事件'], ['score', '分數'], ['full', '完整']], logView, (v) => {
      logView = v;
      renderLog();
    }),
    segControl([['desc', '降序'], ['asc', '順序']], logAsc ? 'asc' : 'desc', (v) => {
      logAsc = v === 'asc';
      renderLog();
    }),
  );

  const ids = session.roster.map((p) => p.id);
  const running = playerRunningTotals(session.hands, ids);

  if (logView !== 'event') {
    const legend = document.createElement('div');
    legend.className = 'score-legend';
    ids.forEach((id) => {
      const s = document.createElement('span');
      s.textContent = nameOf(id);
      legend.append(s);
    });
    ol.append(legend);
  }

  const order = session.hands.map((_, i) => i);
  if (!logAsc) order.reverse();

  let lastRoundLabel = null;
  for (const i of order) {
    const hand = session.hands[i];
    const label = roundLabel(hand.round);
    if (label !== lastRoundLabel) {
      const div = document.createElement('li');
      div.className = 'round-divider';
      div.textContent = label;
      ol.append(div);
      lastRoundLabel = label;
    }
    if (logView === 'event' || logView === 'full') ol.append(eventRow(hand));
    if (logView === 'score' || logView === 'full') ol.append(scoreRow(hand, ids, running[i]));
  }
}

/* ── 統計數據：卡片 + 稱號 + 皇冠 ── */

function computeBadges(rows) {
  const badges = new Map(rows.map((r) => [r.id, '陪跑員']));
  const roasts = new Set(); // 屬於「虧」那一派的稱號，顯示成另一種顏色
  const crowns = { wins: null, selfDraws: null, deals: null };

  // values：逐個玩家對應的比較值（可以是 null，代表沒有資格參與這個稱號）。
  // min：取最小的那個（例如包尾）；否則取最大，並要求 > 0（例如零食糊不會封食糊王）。
  const award = (values, label, { crownKey, roast = false, min = false } = {}) => {
    const present = rows
      .map((r, i) => [r, values[i]])
      .filter(([, v]) => v !== null && v !== undefined);
    if (present.length === 0) return;
    const target = min
      ? Math.min(...present.map(([, v]) => v))
      : Math.max(...present.map(([, v]) => v));
    if (!min && target <= 0) return;
    const leaders = present.filter(([, v]) => v === target);
    if (leaders.length !== 1) return; // 打平就不頒發——寧缺勿濫，不要亂頒
    const winner = leaders[0][0];
    if (crownKey) crowns[crownKey] = winner.id;
    if (badges.get(winner.id) === '陪跑員') {
      badges.set(winner.id, label);
      if (roast) roasts.add(winner.id);
    }
  };

  // 順序 = 優先序：好稱號優先頒發，差的殿後——已經有好稱號的人不會被改頒差的稱號。
  award(rows.map((r) => r.wins), '食糊王', { crownKey: 'wins' });
  award(rows.map((r) => r.selfDraws), '自摸王', { crownKey: 'selfDraws' });
  award(rows.map((r) => r.avgFaan), '番王'); // 食糊的平均番數最高
  award(rows.map((r) => r.biggest), '爆棚王'); // 單鋪贏得最多的那鋪
  award(rows.map((r) => r.deals), '出銃王', { crownKey: 'deals', roast: true });
  award(rows.map((r) => r.total), '包尾', { min: true, roast: true }); // 總數最低

  return { badges, crowns, roasts };
}

function shareResults() {
  const ids = session.roster.map((p) => p.id);
  const rows = [...playerStats(session.hands, ids)].sort((a, b) => b.total - a.total);
  const lines = [
    `雀數 · ${roundLabel(session.round)}`,
    ...rows.map((r, i) => `${i + 1}. ${nameOf(r.id)}　${fmt(r.total)}`),
  ];
  const text = lines.join('\n');
  if (navigator.share) {
    navigator.share({ text }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(text).then(
      () => toast('已複製到剪貼簿'),
      () => toast('無法複製，請自行選取文字'),
    );
  }
}

function renderStats() {
  const box = $('stats');
  box.innerHTML = '';
  const ids = session.roster.map((p) => p.id);
  const rows = playerStats(session.hands, ids);
  const overall = sessionStats(session.hands);

  const summary = document.createElement('p');
  summary.className = 'stat-summary';
  summary.textContent = overall.hands === 0
    ? '再多打幾局，就會有統計數據可看。'
    : `已打 ${overall.hands} 局　·　流局 ${overall.draws}　·　自摸 ${overall.selfDraws}　·　最長連莊 ${overall.longestStreak}`;
  box.append(summary);
  if (overall.hands === 0) return;

  const top = document.createElement('div');
  top.className = 'stat-top';
  const share = document.createElement('button');
  share.textContent = '📤 分享賽果';
  share.onclick = shareResults;
  top.append(share);
  box.append(top);

  const { badges, crowns, roasts } = computeBadges(rows);
  const cards = document.createElement('div');
  cards.className = 'stat-cards';

  [...rows].sort((a, b) => b.total - a.total).forEach((r, rank) => {
    const card = document.createElement('div');
    card.className = 'stat-card';

    const head = document.createElement('div');
    head.className = 'stat-card-head';
    const av = document.createElement('span');
    av.className = 'stat-avatar';
    av.textContent = avatarFor(r.id);
    av.setAttribute('aria-hidden', 'true');
    const rk = document.createElement('span');
    rk.className = 'stat-rank';
    rk.textContent = rank + 1;
    const nm = document.createElement('span');
    nm.className = 'stat-name';
    nm.textContent = nameOf(r.id);
    const bd = document.createElement('span');
    const label = badges.get(r.id);
    bd.className = `stat-badge${label === '陪跑員' ? '' : roasts.has(r.id) ? ' roast' : ' top'}`;
    bd.textContent = label;
    head.append(av, rk, nm, bd);

    const body = document.createElement('div');
    body.className = 'stat-card-body';
    for (const [key, val, lbl] of [
      ['wins', r.wins, '食糊'],
      ['selfDraws', r.selfDraws, '自摸'],
      ['deals', r.deals, '出銃'],
    ]) {
      const cell = document.createElement('div');
      cell.className = 'stat-cell';
      if (crowns[key] === r.id) {
        const cr = document.createElement('span');
        cr.className = 'stat-crown';
        cr.textContent = '👑';
        cr.setAttribute('aria-hidden', 'true');
        cell.append(cr);
      }
      const n = document.createElement('div');
      n.className = 'n';
      n.textContent = val;
      const l = document.createElement('div');
      l.className = 'lbl';
      l.textContent = lbl;
      cell.append(n, l);
      body.append(cell);
    }
    card.append(head, body);
    cards.append(card);
  });
  box.append(cards);

  // 對戰矩陣（誰出銃給誰）——與卡片屬於不同層次的資料，一併保留。
  const m = dealMatrix(session.hands, ids);
  if (m.flat().some((n) => n > 0)) {
    const h = document.createElement('h3');
    h.textContent = '誰出銃給誰';
    const mt = document.createElement('table');
    const head2 = ['出銃 ↓ ／ 食糊 →', ...ids.map(nameOf)];
    mt.innerHTML = `<thead><tr>${head2.map((t) => `<th>${t}</th>`).join('')}</tr></thead>`;
    const mb = document.createElement('tbody');
    ids.forEach((id, i) => {
      const tr = document.createElement('tr');
      const th = document.createElement('td');
      th.textContent = nameOf(id);
      tr.append(th);
      ids.forEach((_, j) => {
        const td = document.createElement('td');
        td.textContent = i === j ? '—' : m[i][j] || '·';
        if (m[i][j] > 0) td.className = 'neg';
        tr.append(td);
      });
      mb.append(tr);
    });
    mt.append(mb);
    box.append(h, mt);
  }
}

/* ── sheet ── */

/** sheet 顯示／隱藏是透過 `.open` class 來切換動畫，`hidden` 只在動畫結束後才設置——
 *  這樣才能讓 CSS transition 有時間執行完畢，不會馬上消失，顯得突兀。 */
const SHEET_MOTION_MS = 200;

function closeSheet() {
  const scrim = $('scrim');
  clearTimeout(closeSheet._t);
  scrim.classList.remove('open');
  closeSheet._t = setTimeout(() => {
    scrim.hidden = true;
    $('sheet').innerHTML = '';
  }, SHEET_MOTION_MS);
}

function openSheet(title, sub, build) {
  const scrim = $('scrim');
  clearTimeout(closeSheet._t);
  const sheet = $('sheet');
  sheet.innerHTML = '';
  const h = document.createElement('h3');
  h.textContent = title;
  const p = document.createElement('p');
  p.className = 'sub';
  p.textContent = sub;
  sheet.append(h, p);
  build(sheet);
  const cancel = document.createElement('button');
  cancel.className = 'cancel';
  cancel.textContent = '取消';
  cancel.onclick = closeSheet;
  sheet.append(cancel);
  scrim.hidden = false;
  scrim.classList.remove('open');
  sheet.scrollTop = 0;
  // 一定要等到下一個 frame：若從 hidden 切回 display 那刻就立即加上 .open，
  // transition 沒有起點可以過渡，會被當成瞬間跳過去，滑入效果就會消失
  requestAnimationFrame(() => { scrim.classList.add('open'); });
}

function optionButton(label, note, primary) {
  const b = document.createElement('button');
  b.className = `opt${primary ? ' primary' : ''}`;
  b.textContent = label;
  if (note) {
    const s = document.createElement('small');
    s.textContent = note;
    b.append(s);
  }
  return b;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  clearTimeout(toast._t);
  clearTimeout(toast._hideT);
  t.hidden = false;
  t.classList.remove('show');
  requestAnimationFrame(() => { t.classList.add('show'); });
  toast._t = setTimeout(() => {
    t.classList.remove('show');
    toast._hideT = setTimeout(() => { t.hidden = true; }, 200);
  }, 2600);
}

/**
 * 轉盤選取：模擬 native picker 的體驗，靠 scroll-snap 實現。
 *
 * 點選一個項目會立即生效（不需要等待 scroll settle）；手指滑動拖曳時，
 * 則要等 scroll 停止（debounce）才算數，兩種操作都會觸發 onChange。
 */
function wheelPicker({ items, selected = 0, onChange }) {
  const frame = document.createElement('div');
  frame.className = 'wheel-frame';
  const band = document.createElement('div');
  band.className = 'wheel-band';
  const wrap = document.createElement('div');
  wrap.className = 'wheel';
  const list = document.createElement('div');
  wrap.append(list);
  frame.append(band, wrap);

  const spacerTop = document.createElement('div');
  const spacerBottom = document.createElement('div');
  const realEls = [];
  list.append(spacerTop);
  items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'wheel-item';
    el.textContent = it.label;
    el.onclick = () => select(i, true);
    list.append(el);
    realEls.push(el);
  });
  list.append(spacerBottom);

  let itemHeight = 40;
  let current = Math.max(0, Math.min(items.length - 1, selected));

  function mark(i) {
    realEls.forEach((el, idx) => el.classList.toggle('on', idx === i));
  }
  function scrollToIndex(i, smooth) {
    wrap.scrollTo({ top: i * itemHeight, behavior: smooth ? 'smooth' : 'auto' });
  }
  function select(i, smooth) {
    i = Math.max(0, Math.min(items.length - 1, i));
    const changed = i !== current;
    current = i;
    mark(i);
    scrollToIndex(i, smooth);
    if (changed) onChange(i, items[i]);
  }

  let settleTimer;
  wrap.addEventListener('scroll', () => {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => {
      const i = Math.max(0, Math.min(items.length - 1, Math.round(wrap.scrollTop / itemHeight)));
      const changed = i !== current;
      current = i;
      mark(i);
      if (changed) onChange(i, items[i]);
    }, 110);
  }, { passive: true });

  requestAnimationFrame(() => {
    itemHeight = realEls[0]?.getBoundingClientRect().height || 40;
    spacerTop.style.height = `${2 * itemHeight}px`;
    spacerBottom.style.height = `${2 * itemHeight}px`;
    scrollToIndex(current, false);
    mark(current);
  });

  return { el: frame, get value() { return current; } };
}

/* ── 記錄一局牌：點選那張座位牌，在同一個 sheet 內選好番數、出銃／自摸、包自摸 ── */

function pickScore(winner) {
  const v = variant();
  const c = session.config;
  const who = nameOf(session.seats[winner]);
  const opponents = [0, 1, 2, 3].filter((s) => s !== winner);

  // 番數 wheel 的內容只計算一次（用 'selfDraw' 取得 label/score 即可）；
  // note（金額）只在 renderPreview 中，才依照實際的 from 重新計算，
  // 這樣切換「出銃／自摸」時，不需要讓整個番數 wheel 重新建立，畫面也不會跳動。
  const faanOptions = v.scoreOptions(c, { winner, from: 'selfDraw', round: session.round });
  const faanItems = [
    { label: '詐糊', misdeal: true },
    ...faanOptions.map((o) => ({ label: o.label, score: o.score })),
  ];
  const fromItems = [
    ...opponents.map((s) => ({ label: nameOf(session.seats[s]), seat: s })),
    { label: '自摸', seat: 'selfDraw' },
  ];

  let faanIdx = faanItems.length > 1 ? 1 : 0;
  let fromIdx = 0;
  let paoOn = false;
  let paoSeat = null;
  let multiRonOn = false;

  const currentFrom = () => fromItems[fromIdx].seat;
  const isSelfDraw = () => currentFrom() === 'selfDraw';
  const isMisdeal = () => !!faanItems[faanIdx].misdeal;

  function draw() {
    openSheet('食糊！', '多少番、由誰出銃或自摸——選好後再確定。', (sheet) => {
      if (isMisdeal()) {
        buildMisdeal(sheet);
        return;
      }

      const row = document.createElement('div');
      row.className = 'wheel-row';

      const faanCol = document.createElement('div');
      faanCol.className = 'wheel-col';
      faanCol.innerHTML = '<div class="wheel-col-label">番數</div>';
      const faanWheel = wheelPicker({
        items: faanItems,
        selected: faanIdx,
        onChange: (i) => {
          faanIdx = i;
          if (isMisdeal()) { draw(); return; }
          renderPreview();
        },
      });
      faanCol.append(faanWheel.el);

      const fromCol = document.createElement('div');
      fromCol.className = 'wheel-col';
      fromCol.innerHTML = '<div class="wheel-col-label">出銃 / 自摸</div>';
      const fromWheel = wheelPicker({
        items: fromItems,
        selected: fromIdx,
        onChange: (i) => {
          fromIdx = i;
          paoOn = false;
          paoSeat = null;
          multiRonOn = false;
          draw(); // from 切換後要顯示／隱藏「包自摸」，整個 sheet 需要重新繪製
        },
      });
      fromCol.append(fromWheel.el);

      row.append(faanCol, fromCol);
      sheet.append(row);

      if (isSelfDraw()) sheet.append(buildPaoToggle());
      else sheet.append(buildMultiRonToggle());

      const preview = document.createElement('p');
      preview.className = 'wheel-preview';
      sheet.append(preview);

      function renderPreview() {
        const from = currentFrom();
        const opts = v.scoreOptions(c, { winner, from, round: session.round });
        const matched = opts[faanIdx - 1]; // faanItems[0] 是詐糊，實際番數由 index 1 開始
        preview.innerHTML = `贏家收<b>${matched ? matched.note : '—'}</b>`;
      }
      renderPreview();

      const confirmRow = document.createElement('div');
      confirmRow.className = 'row';
      const ok = optionButton('確定', null, true);
      ok.onclick = commit;
      confirmRow.append(ok);
      sheet.append(confirmRow);
    });
  }

  function buildPaoToggle() {
    const wrap = document.createElement('div');
    const row = document.createElement('div');
    row.className = 'switch-row';
    const text = document.createElement('div');
    text.className = 'switch-text';
    text.innerHTML =
      '<div class="switch-label">出銃者包自摸</div><div class="switch-hint">由他一人承擔全部六份，其餘兩家不用支付</div>';
    const sw = document.createElement('button');
    sw.className = `switch${paoOn ? ' on' : ''}`;
    sw.setAttribute('aria-pressed', String(paoOn));
    sw.onclick = () => { paoOn = !paoOn; if (!paoOn) paoSeat = null; draw(); };
    row.append(text, sw);
    wrap.append(row);

    if (paoOn) {
      const grid = document.createElement('div');
      grid.className = 'grid two';
      grid.style.marginTop = '.6rem';
      opponents.forEach((seat) => {
        const b = optionButton(nameOf(session.seats[seat]), null);
        b.classList.add('tight');
        if (paoSeat === seat) b.classList.add('on');
        b.onclick = () => { paoSeat = seat; draw(); };
        grid.append(b);
      });
      wrap.append(grid);
    }
    return wrap;
  }

  function buildMultiRonToggle() {
    const wrap = document.createElement('div');
    const row = document.createElement('div');
    row.className = 'switch-row';
    const text = document.createElement('div');
    text.className = 'switch-text';
    text.innerHTML =
      '<div class="switch-label">一炷多響</div><div class="switch-hint">這炷不只一家食糊，確定後可以再加入其他幾家</div>';
    const sw = document.createElement('button');
    sw.className = `switch${multiRonOn ? ' on' : ''}`;
    sw.setAttribute('aria-pressed', String(multiRonOn));
    sw.onclick = () => { multiRonOn = !multiRonOn; draw(); };
    row.append(text, sw);
    wrap.append(row);
    return wrap;
  }

  function buildMisdeal(sheet) {
    const base = unitFor(c.minFaan, c);
    const p = document.createElement('p');
    p.className = 'sub';
    p.style.marginTop = '0';
    p.textContent = `${who} 詐糊，要賠給其餘三家，每人多少？`;
    sheet.append(p);

    const input = document.createElement('input');
    input.type = 'number';
    input.min = '1';
    input.inputMode = 'numeric';
    input.value = String(base);
    sheet.append(input);

    const quick = document.createElement('div');
    quick.className = 'grid';
    quick.style.marginTop = '.6rem';
    [1, 2, 4].forEach((mult) => {
      const b = optionButton(String(base * mult), mult === 1 ? '起糊份額' : `×${mult}`);
      b.classList.add('tight');
      b.onclick = () => { input.value = String(base * mult); };
      quick.append(b);
    });
    sheet.append(quick);

    const row = document.createElement('div');
    row.className = 'row';
    const ok = optionButton('確定', null, true);
    ok.onclick = () => {
      const amt = Math.round(Number(input.value));
      if (!Number.isFinite(amt) || amt <= 0) { toast('金額有誤'); return; }
      record([{ kind: 'penalty', by: winner, perPlayer: amt }], `${who} 詐糊，賠 ${amt}`);
    };
    row.append(ok);
    sheet.append(row);
  }

  function commit() {
    const opt = faanItems[faanIdx];
    const from = currentFrom();
    const how = from === 'selfDraw' ? '自摸' : `食 ${nameOf(session.seats[from])}`;
    const usePao = paoOn && paoSeat !== null;
    const winEvent = { kind: 'win', winner, from, score: opt.score, ...(usePao ? { pao: paoSeat } : {}) };
    const label = usePao
      ? `${who} ${how} ${opt.label}（${nameOf(session.seats[paoSeat])} 包自摸）`
      : `${who} ${how} ${opt.label}`;
    if (multiRonOn && from !== 'selfDraw') {
      pickExtraRonWinner(from, [winEvent], [label], [winner]);
    } else {
      record([winEvent], label);
    }
  }

  function pickExtraRonWinner(from, events, labels, takenWinners) {
    const remaining = [0, 1, 2, 3].filter((s) => s !== from && !takenWinners.includes(s));
    if (remaining.length === 0) { record(events, labels.join('，')); return; }
    openSheet('一炷多響', `${nameOf(session.seats[from])} 這炷，還有哪家一起食？`, (sheet) => {
      const grid = document.createElement('div');
      grid.className = 'grid two';
      remaining.forEach((seat) => {
        const b = optionButton(nameOf(session.seats[seat]), null);
        b.onclick = () => pickExtraRonFaan(seat, from, events, labels, takenWinners);
        grid.append(b);
      });
      sheet.append(grid);
      const row = document.createElement('div');
      row.className = 'row';
      const done = optionButton('夠了，記錄', null, true);
      done.onclick = () => record(events, labels.join('，'));
      row.append(done);
      sheet.append(row);
    });
  }

  function pickExtraRonFaan(seat, from, events, labels, takenWinners) {
    const opts = v.scoreOptions(c, { winner: seat, from, round: session.round });
    let idx = opts.length > 1 ? 1 : 0;

  }

  draw();

/**
 * 玩法與賠率編輯器。
 *
 * Variant-agnostic：逐項調整的部分不預設任何一種麻雀的欄位，全部由
 * `variant().ruleFields` 告訴它要畫什麼（見 src/variant.ts 的 RuleField）。
 * 只有「大細」這個 stake 欄位仍需特殊處理——並非讓人直接填寫基數（沒有人
 * 心裡是以基數在思考的），而是選一個番數，說明「這個番數打多大」，
 * 整張表會按級距自動換算。這種選法目前只用於香港／跑馬仔（兩者 config 形狀一樣）。
 */
function openRuleEditor() {
  let variantId = session.variantId;
  let presetName = session.presetName;
  let draft = { ...session.config };
  let anchorFaan = draft.maxFaan;

  function pickVariant(id) {
    variantId = id;
    const [name, cfg] = Object.entries(variantById(id).presets)[0];
    presetName = name;
    draft = { ...cfg };
    anchorFaan = draft.maxFaan;
    build();
  }

  function build() {
    const v = variantById(variantId);

    openSheet('玩法與賠率', '選擇麻雀種類、選一個現成玩法，或自行調整。改動後可立即看到整張賠率表。', (sheet) => {
      const markCustom = () => { presetName = CUSTOM; };

      // ── 揀玩法 ──
      if (VARIANTS.length > 1) {
        const variantField = document.createElement('div');
        variantField.className = 'field';
        variantField.innerHTML = '<label>玩法</label>';
        const variantGrid = document.createElement('div');
        variantGrid.className = 'grid two';
        for (const vv of VARIANTS) {
          const b = optionButton(vv.name, null);
          b.classList.add('tight');
          if (vv.id === variantId) b.classList.add('on');
          b.onclick = () => pickVariant(vv.id);
          variantGrid.append(b);
        }
        variantField.append(variantGrid);
        sheet.append(variantField);
      }

      // ── 現成玩法 ──
      const presetField = document.createElement('div');
      presetField.className = 'field';
      presetField.innerHTML = '<label>現成玩法</label>';
      const presetGrid = document.createElement('div');
      presetGrid.className = 'grid two';
      for (const [name, cfg] of Object.entries(v.presets)) {
        const b = optionButton(name, null);
        b.classList.add('tight');
        if (presetName === name) b.classList.add('on');
        b.onclick = () => {
          draft = { ...cfg };
          presetName = name;
          anchorFaan = draft.maxFaan;
          build();
        };
        presetGrid.append(b);
      }
      presetField.append(presetGrid);
      sheet.append(presetField);

      // ── 逐項調 ──
      const chooser = (label, values, current, onPick, fmtLabel = String) => {
        const wrap = document.createElement('div');
        wrap.className = 'field';
        wrap.innerHTML = `<label>${label}</label>`;
        const g = document.createElement('div');
        g.className = 'grid';
        for (const val of values) {
          const b = optionButton(fmtLabel(val), null);
          b.classList.add('tight');
          if (val === current) b.classList.add('on');
          b.onclick = () => { onPick(val); markCustom(); build(); };
          g.append(b);
        }
        wrap.append(g);
        sheet.append(wrap);
      };

      const numberField = (label, current, onCommit) => {
        const wrap = document.createElement('div');
        wrap.className = 'field';
        wrap.innerHTML = `<label>${label}</label>`;
        const input = document.createElement('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.setAttribute('aria-label', label);
        input.value = String(current);
        const commit = () => {
          const n = Number(input.value);
          if (!Number.isFinite(n)) return;
          onCommit(n);
          markCustom();
          build();
        };
        input.onchange = commit;
        input.onkeydown = (e) => { if (e.key === 'Enter') commit(); };
        wrap.append(input);
        sheet.append(wrap);
      };

      let stakeLabel = null;
      for (const f of v.ruleFields) {
        if (f.kind === 'choice') {
          chooser(f.label, f.values, draft[f.key], (val) => { draft[f.key] = val; }, f.fmt ?? String);
        } else if (f.kind === 'toggle') {
          chooser(f.label, [true, false], draft[f.key],
            (val) => { draft[f.key] = val; },
            (val) => (val ? f.onLabel : f.offLabel));
        } else if (f.kind === 'number') {
          numberField(f.label, draft[f.key], (val) => { draft[f.key] = val; });
        } else if (f.kind === 'stake') {
          stakeLabel = f.label;
        }
      }

      // ── 大細（目前只有香港／跑馬仔才有這個欄位） ──
      const problem = stakeLabel ? validateConfig(draft) : null;
      if (stakeLabel) {
        const stake = document.createElement('div');
        stake.className = 'field';
        stake.innerHTML = `<label>${stakeLabel}</label>`;

        if (!problem) {
          anchorFaan = Math.min(draft.maxFaan, Math.max(draft.minFaan, anchorFaan ?? draft.maxFaan));
          const anchorRow = document.createElement('div');
          anchorRow.className = 'anchor';

          const sel = document.createElement('select');
          sel.setAttribute('aria-label', '以哪個番數作為基準');
          for (let f = draft.minFaan; f <= draft.maxFaan; f++) {
            const o = document.createElement('option');
            o.value = String(f);
            o.textContent = `${f}番`;
            if (f === anchorFaan) o.selected = true;
            sel.append(o);
          }
          const amountInput = document.createElement('input');
          amountInput.type = 'number';
          amountInput.min = '1';
          amountInput.inputMode = 'numeric';
          amountInput.setAttribute('aria-label', '打多大');
          amountInput.value = String(unitFor(anchorFaan, draft));

          const apply = () => {
            const amount = Number(amountInput.value);
            if (!Number.isFinite(amount) || amount <= 0) return;
            try {
              draft.base = baseForAnchor(anchorFaan, amount, draft);
              markCustom();
              build();
            } catch { /* 輸入尚未完整，不要顯示錯誤 */ }
          };
          sel.onchange = () => { anchorFaan = Number(sel.value); build(); };
          amountInput.onchange = apply;
          amountInput.onkeydown = (e) => { if (e.key === 'Enter') apply(); };

          anchorRow.append(sel, amountInput);
          stake.append(anchorRow);

          const quick = document.createElement('div');
          quick.className = 'row';
          const half = optionButton('減半', null);
          const dbl = optionButton('加倍', null);
          half.classList.add('tight');
          dbl.classList.add('tight');
          half.onclick = () => { draft.base = Math.max(1, Math.round(draft.base / 2)); markCustom(); build(); };
          dbl.onclick = () => { draft.base *= 2; markCustom(); build(); };
          quick.append(half, dbl);
          stake.append(quick);
        }
        sheet.append(stake);
      }

      // ── 賠率表（目前只有具備 stake 欄位的玩法才有） ──
      if (problem) {
        const w = document.createElement('p');
        w.className = 'warn-line';
        w.textContent = problem;
        sheet.append(w);
      } else if (stakeLabel) {
        const wrap = document.createElement('div');
        wrap.className = 'rate-wrap';
        const head = document.createElement('div');
        head.className = 'rate-head';
        head.textContent = '賠率表';
        const t = document.createElement('table');
        t.className = 'rates';
        t.innerHTML = '<thead><tr><th>番數</th><th>基數</th><th>出銃收</th><th>自摸收</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const { faan, unit } of unitTable(draft)) {
          const tr = document.createElement('tr');
          if (faan === anchorFaan) tr.className = 'anchor-row';
          for (const text of [`${faan}番`, String(unit), String(4 * unit), String(6 * unit)]) {
            const td = document.createElement('td');
            td.textContent = text;
            tr.append(td);
          }
          tb.append(tr);
        }
        t.append(tb);
        wrap.append(head, t);
        sheet.append(wrap);

        const note = document.createElement('p');
        note.className = 'note-line';
        note.textContent = draft.liability === 'full'
          ? '全銃：出銃者一人支付全部。自摸三家各付一份。'
          : '半銃：出銃者支付雙份，其餘兩家各付一份。自摸三家各付一份。';
        sheet.append(note);
      } else {
        const summary = document.createElement('p');
        summary.className = 'note-line';
        summary.textContent = v.summary(draft);
        sheet.append(summary);
      }

      // ── 使用這個 ──
      const row = document.createElement('div');
      row.className = 'row';
      const started = session.hands.length > 0;
      const ok = optionButton(
        started ? '用這個開新牌局' : '就用這個',
        started ? '現在的分數將會清零' : null,
        true,
      );
      if (problem) { ok.disabled = true; ok.style.opacity = '.45'; }
      ok.onclick = () => {
        if (problem) return;
        const keep = session.roster;
        const seats = session.seats;
        session = newSession(presetName, session.diceCount, { ...draft });
        session.presetName = presetName;
        session.roster = keep;
        session.seats = seats;
        lastRoll = null;
        closeSheet();
        render();
        toast(`已開新牌局：${presetName}`);
      };
      row.append(ok);
      sheet.append(row);
    });
  }

  build();
}

/* ── 加到主畫面 ──
   Android/Chrome 會自動跳出 install prompt；iOS 沒有，需要手動教學。
   兩者都只有在 http(s) 環境下才有意義——直接開啟檔案則不需要安裝。 */
function setupInstallHint() {
  const bar = $('a2hs');
  if (!bar) return;
  const DISMISSED = 'mahjong.a2hs.dismissed';
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  let dismissed = false;
  try { dismissed = localStorage.getItem(DISMISSED) === '1'; } catch { /* 隱私模式 */ }
  if (standalone || dismissed || !location.protocol.startsWith('http')) return;

  // navigator.standalone 只有 Safari 才有——用來區分「真正的 iPad」與「具備觸控功能的 Mac」
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1 && 'standalone' in navigator);
  let deferred = null;

  const show = (html) => {
    bar.innerHTML = '';
    const text = document.createElement('span');
    text.innerHTML = html;
    const close = document.createElement('button');
    close.textContent = '不用了';
    close.onclick = () => {
      bar.hidden = true;
      try { localStorage.setItem(DISMISSED, '1'); } catch { /* 忽略 */ }
    };
    bar.append(text, close);
    bar.hidden = false;
  };

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    show('<b>加到主畫面</b>　使用起來與 app 一樣，離線也可以使用。');
    const add = document.createElement('button');
    add.textContent = '加';
    add.onclick = async () => {
      bar.hidden = true;
      deferred.prompt();
      await deferred.userChoice;
      deferred = null;
    };
    bar.insertBefore(add, bar.lastChild);
  });

  if (isIOS) {
    show('<b>加到主畫面</b>　點下方的「分享」按鈕 → 加至主畫面，之後開啟時就不會顯示網址列。');
  }
}
setupInstallHint();

/* 部署到網路上之後即可離線使用。以 file:// 開啟時沒有 service worker，
   但此時檔案本身已經在裝置上，同樣可以離線執行。 */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {

/* 打牌時螢幕熄滅後要重新點亮，非常不便 */
if ('wakeLock' in navigator) {
  const keepAwake = () => navigator.wakeLock.request('screen').catch(() => {});
  keepAwake();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
  });
}

/* ── 啟動 ── */
session = load() ?? newSession(firstPreset());
setTab('log');
render();
if (session.hands.length > 0) toast(`接續上次：已打 ${session.hands.length} 局`);

</script>
</body>
</html>
