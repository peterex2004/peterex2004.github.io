<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS 加到主畫面之後就冇 Safari 個工具列，似真 app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雀數">
<!-- iOS 唔認 SVG 做主畫面 icon，一定要 PNG -->
<link rel="apple-touch-icon" href="icon-180.png">
<!-- 未公開：唔想 Google 索引到。想公開嗰陣刪咗呢行。 -->
<meta name="robots" content="noindex, nofollow">
<title>雀數 · 打麻雀記分</title>
<meta name="theme-color" content="#12483A">
<!-- 淨係喺 server 上面行嗰陣先用得着；double-click 開個檔案本身已經離線 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root {
  --bg:        #E9EDE6;
  --felt:      #12483A;
  --felt-deep: #0C3529;
  --tile:      #FBF9F3;
  --tile-edge: #DAD5C6;
  --tile-ink:  #1A2420;
  --surface:   #FFFFFF;
  --surface-2: #EFF2EC;
  --ink:       #16211C;
  --muted:     #64756C;
  --accent:    #14624E;
  --gold:      #B08A2E;
  --red:       #A5382B;
  --rule:      #D6DDD3;
  --shadow:    rgba(16, 30, 24, .16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0A120F;
    --felt:      #10382C;
    --felt-deep: #08241C;
    --tile:      #EDEAE0;
    --tile-edge: #B9B4A4;
    --tile-ink:  #17201C;
    --surface:   #141F1A;
    --surface-2: #1B2822;
    --ink:       #E7EEE9;
    --muted:     #8CA298;
    --accent:    #4FBB9A;
    --gold:      #D9B45A;
    --red:       #E2796C;
    --rule:      #24332D;
    --shadow:    rgba(0, 0, 0, .55);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html {
  height: 100%;
  /* 手機轉橫掂唔好自己放大字 */
  -webkit-text-size-adjust: 100%;
  /* 唔好落拉刷新／唔好彈彈吓——打牌打到一半 reload 就大鑊 */
  overscroll-behavior: none;
}
body {
  /* 100vh 喺 iOS Safari 會計埋工具列，撞到個底，所以用 svh 做最低高度。
     用 min-height 唔用 height：紀錄多嗰陣要俾成頁郁得，唔係鎖死喺一個
     螢幕度——之前鎖死咗，紀錄得返好少位，仲 scroll 唔到上去睇。 */
  min-height: 100vh;
  min-height: 100svh;
  overscroll-behavior-y: none; /* 淨係擋落拉刷新，唔會擋正常 scroll */
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Segoe UI", system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; cursor: pointer; color: inherit; }
button:active:not(:disabled) { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ══ header：局面做主角 ══ */
header {
  display: flex;
  align-items: center;
  gap: .7rem;
  /* 瀏海／動態島底下唔可以擺嘢 */
  padding: calc(.75rem + env(safe-area-inset-top)) calc(.95rem + env(safe-area-inset-right))
           .6rem calc(.95rem + env(safe-area-inset-left));
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.round-block { flex: 1; min-width: 0; }
.round-label {
  font-family: "Songti TC", "Noto Serif TC", serif;
  font-size: 1.32rem;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: .02em;
}
.round-sub {
  font-size: .69rem;
  color: var(--muted);
  margin-top: .12rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.streak-pill {
  display: inline-block;
  background: var(--gold);
  color: #fff;
  font-size: .62rem;
  font-weight: 600;
  padding: .06rem .34rem;
  border-radius: 3px;
  margin-left: .35rem;
  vertical-align: 2px;
}
.streak-pill[hidden] { display: none !important; }
.icons { display: flex; gap: .3rem; flex-shrink: 0; }
.icon-btn {
  /* Apple HIG：可撳嘅嘢最細 44×44 */
  width: 2.75rem; height: 2.75rem;
  border: 1px solid var(--rule);
  background: var(--surface-2);
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: .96rem;
}
.icon-btn:disabled { opacity: .33; }

/* ══ 檯面 ══ */
main {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  padding: .5rem calc(.7rem + env(safe-area-inset-right)) .5rem calc(.7rem + env(safe-area-inset-left));
  min-height: 0;
}
.felt {
  width: min(100%, 30rem, 100%);
  aspect-ratio: 1;
  max-height: 100%;
  background: radial-gradient(ellipse at 50% 42%, var(--felt) 0%, var(--felt-deep) 100%);
  border-radius: 22px;
  padding: 3.5%;
  display: grid;
  grid-template-columns: 1fr 1.1fr 1fr;
  grid-template-rows: 1fr 1.1fr 1fr;
  gap: 2.5%;
  box-shadow: 0 14px 34px -14px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.05);
}

/* 座位卡 = 一隻牌 */
.seat {
  position: relative;
  border: none;
  border-radius: 9px;
  padding: .3rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .05rem;
  min-width: 0;
  background: linear-gradient(#FFFFFF 0%, var(--tile) 42%, var(--tile-edge) 100%);
  color: var(--tile-ink);
  box-shadow:
    0 2px 0 0 rgba(0,0,0,.16),
    0 4px 9px -3px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.9);
}
.seat.dealer {
  box-shadow: 0 2px 0 0 rgba(0,0,0,.16), 0 4px 9px -3px rgba(0,0,0,.34),
              inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 2.5px var(--accent);
}
.seat.lands {
  box-shadow: 0 2px 0 0 rgba(0,0,0,.16), 0 4px 9px -3px rgba(0,0,0,.34),
              inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 2.5px var(--gold);
}
.seat .wind {
  font-family: "Songti TC", "Noto Serif TC", serif;
  font-size: clamp(1.1rem, 5.2vw, 1.7rem);
  line-height: 1;
  color: var(--accent);
  text-shadow: 0 1px 0 rgba(255,255,255,.8);
}
.seat .nm {
  font-size: clamp(.68rem, 2.9vw, .84rem);
  font-weight: 600;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  opacity: .82;
}
.seat .amt {
  font-size: clamp(.92rem, 4.3vw, 1.32rem);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.pos { color: var(--accent); }
.neg { color: var(--red); }
.zero { color: var(--muted); }
.seat .tag {
  position: absolute;
  top: .25rem; left: .3rem;
  font-size: .55rem;
  font-weight: 700;
  letter-spacing: .05em;
  padding: .04rem .26rem;
  border-radius: 3px;
  background: var(--accent);
  color: #fff;
}
.seat .lead { position: absolute; top: .2rem; right: .3rem; font-size: .7rem; line-height: 1; }

/* 座位：0=下 1=右 2=上 3=左（逆時針） */
#seat0 { grid-area: 3 / 2; }
#seat1 { grid-area: 2 / 3; }
#seat2 { grid-area: 1 / 2; }
#seat3 { grid-area: 2 / 1; }

.center {
  grid-area: 2 / 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .3rem;
  min-width: 0;
}
.dice { display: flex; gap: .22rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.dice[hidden] { display: none !important; }
.die {
  width: 1.4rem; height: 1.4rem;
  background: #F8F7F2;
  border-radius: 4px;
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  padding: 2px;
  box-shadow: 0 1px 3px rgba(0,0,0,.45);
}
.die i { width: 3.5px; height: 3.5px; border-radius: 50%; background: #1A1A1A; align-self: center; justify-self: center; }
.die[data-v="1"] i:nth-child(1) { grid-area: 2/2; }
.die[data-v="2"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="2"] i:nth-child(2) { grid-area: 3/3; }
.die[data-v="3"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="3"] i:nth-child(2) { grid-area: 2/2; } .die[data-v="3"] i:nth-child(3) { grid-area: 3/3; }
.die[data-v="4"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="4"] i:nth-child(2) { grid-area: 1/3; } .die[data-v="4"] i:nth-child(3) { grid-area: 3/1; } .die[data-v="4"] i:nth-child(4) { grid-area: 3/3; }
.die[data-v="5"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="5"] i:nth-child(2) { grid-area: 1/3; } .die[data-v="5"] i:nth-child(3) { grid-area: 2/2; } .die[data-v="5"] i:nth-child(4) { grid-area: 3/1; } .die[data-v="5"] i:nth-child(5) { grid-area: 3/3; }
.die[data-v="6"] i:nth-child(1) { grid-area: 1/1; } .die[data-v="6"] i:nth-child(2) { grid-area: 1/3; } .die[data-v="6"] i:nth-child(3) { grid-area: 2/1; } .die[data-v="6"] i:nth-child(4) { grid-area: 2/3; } .die[data-v="6"] i:nth-child(5) { grid-area: 3/1; } .die[data-v="6"] i:nth-child(6) { grid-area: 3/3; }
.dice-sum { color: #CFE3D9; font-size: .68rem; font-variant-numeric: tabular-nums; text-align: center; }
.center .hint { color: #7FA294; font-size: .64rem; text-align: center; line-height: 1.45; }

/* ══ 大掣 ══ */
.actions {
  display: flex;
  gap: .5rem;
  padding: 0 calc(.95rem + env(safe-area-inset-right)) .7rem calc(.95rem + env(safe-area-inset-left));
}
.act {
  flex: 1;
  padding: .85rem .5rem;
  min-height: 3rem;
  border-radius: 12px;
  border: 1px solid var(--rule);
  background: var(--surface);
  font-size: .93rem;
  font-weight: 600;
  box-shadow: 0 1px 2px var(--shadow);
}

/* ══ tabs + panels ══ */
.tabs {
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  /* 成頁 scroll 落去嗰陣黐喺頂，隨時換 tab；加返少少頂邊距
     頂住個瀏海／狀態列，因為呢排掣有機會黐到最頂。 */
  position: sticky;
  top: 0;
  padding-top: env(safe-area-inset-top);
  z-index: 5;
}
.tab {
  flex: 1; border: none; background: none; padding: .7rem;
  min-height: 2.75rem;
  color: var(--muted); font-size: .82rem; font-weight: 600;
  border-bottom: 2px solid transparent;
}
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.panel {
  background: var(--surface);
  /* 唔再靠「剩返幾多位」嚟決定紀錄畀幾多位——夠一個screen高，
     紀錄少都唔會迫住，紀錄多就成頁自然拉長，scroll 落去睇晒。 */
  min-height: 60svh;
  padding-bottom: calc(1rem + env(safe-area-inset-bottom));
}
.panel[hidden] { display: none !important; }

/* ── 詳細紀錄：工具列（睇邊種、順序） ── */
.log-toolbar {
  display: flex;
  gap: .5rem;
  padding: .55rem .95rem;
  flex-wrap: wrap;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
/* class 嘅 display:flex specificity 贏 [hidden] 個 UA 預設，要自己補一條先真係隱藏得到
   ——同 .panel[hidden] / .dice[hidden] 果個坑一樣。 */
.log-toolbar[hidden] { display: none !important; }
.seg { display: flex; background: var(--surface-2); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button {
  border: none; background: transparent; padding: .34rem .62rem; border-radius: 7px;
  font-size: .74rem; font-weight: 600; color: var(--muted); min-height: 1.9rem;
}
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }

.log-list { list-style: none; margin: 0; padding: 0; }
.log-list li {
  display: grid;
  grid-template-columns: 1.5rem 4.4rem 1fr auto;
  gap: .5rem;
  align-items: baseline;
  padding: .42rem .95rem;
  font-size: .78rem;
  border-bottom: 1px solid var(--rule);
}
.log-list .seq, .log-list .rnd { color: var(--muted); font-variant-numeric: tabular-nums; }
.log-list .rnd { font-size: .71rem; }
.log-list .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
.log-list li.empty { display: block; padding: 1rem .95rem; color: var(--muted); font-size: .8rem; text-align: center; }

/* 「分數」view：一鋪一橫排，四個位各自嘅呢鋪／累計 */
.log-list li.score-row {
  display: block;
  padding: .5rem .95rem;
}
.score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .3rem; text-align: center; }
.score-grid .cell .delta { font-size: .84rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.score-grid .cell .cum { font-size: .67rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: .05rem; }
.score-grid .cell .delta.zero, .score-grid .cell .cum { color: var(--muted); }
.score-meta {
  display: flex; justify-content: space-between; gap: .5rem;
  font-size: .68rem; color: var(--muted); margin-bottom: .3rem;
}
.score-legend {
  /* 冇做 sticky——同 tabs 疊埋一齊要計安全區高度，喺唔同機仔會唔啱位。
     淨係俾個 tabs sticky 已經夠用（隨時換 tab），呢個 legend 一齊 scroll 走得。 */
  display: grid; grid-template-columns: repeat(4, 1fr); gap: .3rem;
  padding: .5rem .95rem; font-size: .68rem; color: var(--muted); text-align: center;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.log-list li.round-divider {
  /* .log-list li 個 grid（class+element，specificity 贏單一個 class）
     會將呢個得一嚿文字嘅 <li> 谷去第一格 1.5rem 闊，中文冇字距
     就逐隻字換行——同之前 empty-state 嗰個坑一樣，要用返 display:block 頂走。 */
  display: block;
  padding: .4rem .95rem;
  font-size: .68rem; font-weight: 700; color: var(--accent);
  background: var(--surface-2); letter-spacing: .03em;
}

/* ── 統計數據：卡片 ── */
#stats { padding: .5rem .95rem .9rem; }
.stat-summary { margin: 0 0 .6rem; font-size: .76rem; color: var(--muted); }
.stat-top { display: flex; justify-content: flex-end; margin-bottom: .5rem; }
.stat-top button {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 9px;
  padding: .4rem .7rem; font-size: .78rem; font-weight: 600; min-height: 2.4rem;
}
.stat-cards { display: flex; flex-direction: column; gap: .6rem; }
.stat-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: .75rem .9rem; }
.stat-card-head { display: flex; align-items: center; gap: .5rem; }
.stat-avatar { font-size: 1.3rem; line-height: 1; }
.stat-rank { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.stat-name {
  font-weight: 700; font-size: .92rem; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.stat-badge {
  font-size: .68rem; font-weight: 600; padding: .22rem .58rem; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); white-space: nowrap; flex-shrink: 0;
}
.stat-badge.top { background: rgba(176,138,46,.18); color: var(--gold); }
.stat-card-body {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem;
  margin-top: .6rem; padding-top: .6rem; border-top: 1px solid var(--rule);
}
.stat-cell { text-align: center; position: relative; }
.stat-cell .n { font-size: 1.18rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-cell .lbl { font-size: .68rem; color: var(--muted); margin-top: .1rem; }
.stat-crown { position: absolute; top: -1.1rem; left: 50%; transform: translateX(-50%); font-size: .8rem; }

#stats table { width: 100%; border-collapse: collapse; font-size: .76rem; font-variant-numeric: tabular-nums; }
#stats th { text-align: right; font-weight: 600; color: var(--muted); font-size: .67rem; padding: .28rem .22rem; border-bottom: 1px solid var(--rule); }
#stats th:first-child, #stats td:first-child { text-align: left; }
#stats td { text-align: right; padding: .34rem .22rem; border-bottom: 1px solid var(--rule); }
#stats h3 { font-size: .72rem; color: var(--muted); margin: 1rem 0 .25rem; }

/* 直向：等啲仔女直接參與 body 個 flex，唔好多咗一層 */
.side { display: contents; }

/* ══ 打橫用 ══ */
@media (orientation: landscape) and (max-height: 34rem) {
  /* 打橫個螢幕矮，成頁 scroll 反而唔啱用——照舊鎖死一個 screen，
     紀錄靠 .panel 自己嗰嚿 scroll。flex-wrap 限制唔到第二行嘅高度，
     所以要用 grid 先鎖得住。 */
  body {
    display: grid;
    grid-template-columns: 52fr 44fr;
    grid-template-rows: auto auto minmax(0, 1fr);
    min-height: 100svh;
    height: 100svh;
    overflow: hidden;
  }
  .tabs { position: static; padding-top: 0; }
  header { grid-column: 1 / -1; grid-row: 1;
           padding-top: calc(.4rem + env(safe-area-inset-top)); padding-bottom: .35rem; }
  .a2hs { grid-column: 1 / -1; grid-row: 2; }
  main { grid-column: 1; grid-row: 3; }
  .side { grid-column: 2; grid-row: 3; }
  .round-label { font-size: 1.1rem; }
  .a2hs { width: 100%; }
  /* 打橫嗰陣個檯面要由高度決定大細，唔係嘅話會撐爆條 viewport */
  main { min-width: 0; min-height: 0; }
  .felt { height: 100%; width: auto; max-width: 100%; }
  .side { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .actions { padding-top: .45rem; padding-bottom: .45rem; }
  .act { min-height: 2.75rem; padding: .5rem; }
  .panel {
    flex: 1 1 auto;
    min-height: 0;
    max-height: none;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
}

/* ══ 加到主畫面提示 ══ */
.a2hs {
  display: flex;
  align-items: center;
  gap: .6rem;
  margin: 0;
  padding: .6rem calc(.95rem + env(safe-area-inset-right)) .6rem calc(.95rem + env(safe-area-inset-left));
  background: var(--surface-2);
  border-bottom: 1px solid var(--rule);
  font-size: .76rem;
  color: var(--muted);
  line-height: 1.45;
}
.a2hs[hidden] { display: none !important; }
.a2hs b { color: var(--ink); font-weight: 600; }
.a2hs button {
  margin-left: auto;
  flex-shrink: 0;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 8px;
  padding: .4rem .7rem;
  font-size: .74rem;
  min-height: 2.75rem;
}

/* ══ sheet ══ */
.scrim {
  position: fixed; inset: 0;
  background: rgba(6,16,12,.55);
  display: grid; place-items: end center;
  z-index: 10;
}
.scrim[hidden] { display: none !important; }
.sheet {
  background: var(--bg);
  width: min(100%, 29rem);
  max-height: 92vh;
  overflow-y: auto;
  border-radius: 18px 18px 0 0;
  padding: 1.05rem calc(1rem + env(safe-area-inset-right))
           calc(1.05rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
  overscroll-behavior: contain;
  box-shadow: 0 -10px 34px -12px rgba(0,0,0,.5);
}
.sheet h3 { margin: 0 0 .12rem; font-size: 1.08rem; }

  return JSON.stringify(envelope);
}

/**
 * 讀返出嚟。
 *
 * 讀唔到（第一次用、資料壞咗、schema 太新）就回 null，
 * 由叫嘅人決定點做——**唔會擲錯**，因為開唔到 app 係最差嘅結果。
 */
function deserialize   (raw               )           {
  if (!raw) return null;
  let parsed         ;
  try {
    parsed = JSON.parse(raw);
  } catch {
    return null;
  }
  if (typeof parsed !== 'object' || parsed === null) return null;

  const env = parsed                        ;
  if (typeof env.schema !== 'number' || env.schema > SCHEMA) return null;
  if (!env.session || typeof env.session !== 'object') return null;

  return env.session;
}

/** 匯出成 CSV，方便攞去 Excel 對數。 */
function toCSV(
  hands   
                
                    
                     
                   
     ,
  nameOf                        ,
)         {
  const rows = [['鋪', '玩家1', '玩家2', '玩家3', '玩家4'].join(',')];
  for (const h of hands) {
    rows.push([
      h.seq,
      ...h.seats.map((id, i) => `${nameOf(id)} ${h.deltas[i]  > 0 ? '+' : ''}${h.deltas[i]}`),
    ].join(','));
  }
  return rows.join('\n');
}

return { serialize, deserialize, toCSV };

function describe(hand) {
  const ev = hand.events[0];
  if (ev.kind === 'draw') return '流局';
  if (ev.kind === 'penalty') return `${nameOf(hand.seats[ev.by])} 詐糊`;
  if (ev.kind === 'win') {
    const who = nameOf(hand.seats[ev.winner]);
    const how = ev.from === 'selfDraw' ? '自摸' : `食 ${nameOf(hand.seats[ev.from])}`;
    const pao = ev.pao !== undefined ? `（${nameOf(hand.seats[ev.pao])} 包）` : '';
    return `${who} ${how} ${variant().describeScore(ev.score)}${pao}`;
  }
  return ev.kind;
}

function computeBadges(rows) {
  const badges = new Map(rows.map((r) => [r.id, '陪跑員']));
  const crowns = { wins: null, selfDraws: null, deals: null };
  const pick = (key, label) => {
    const max = Math.max(...rows.map((r) => r[key]));
    if (max <= 0) return;
    const leaders = rows.filter((r) => r[key] === max);
    if (leaders.length !== 1) return; // 撞平就唔頒——寧願冇，唔好亂頒
    crowns[key] = leaders[0].id;
    if (badges.get(leaders[0].id) === '陪跑員') badges.set(leaders[0].id, label);
  };
  pick('wins', '食糊王');
  pick('deals', '出銃王');
  pick('selfDraws', '自摸王');
  return { badges, crowns };
}

function shareResults() {
  const ids = session.roster.map((p) => p.id);
  const rows = [...playerStats(session.hands, ids)].sort((a, b) => b.total - a.total);
  const lines = [
    `雀數 · ${roundLabel(session.round)}`,
    ...rows.map((r, i) => `${i + 1}. ${nameOf(r.id)}　${fmt(r.total)}`),
  ];
  const text = lines.join('\n');
  if (navigator.share) {
    navigator.share({ text }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(text).then(
      () => toast('已經 copy 咗去剪貼簿'),
      () => toast('copy 唔到，請自己 select'),
    );
  }
}

  box.append(summary);

  const { badges, crowns } = computeBadges(rows);
  const cards = document.createElement('div');
  cards.className = 'stat-cards';

  [...rows].sort((a, b) => b.total - a.total).forEach((r, rank) => {
    const card = document.createElement('div');
    card.className = 'stat-card';

    const head = document.createElement('div');

    const av = document.createElement('span');
    av.className = 'stat-avatar';

    const rk = document.createElement('span');
    rk.className = 'stat-rank';
    rk.textContent = rank + 1;
    const nm = document.createElement('span');
    nm.className = 'stat-name';
    nm.textContent = nameOf(r.id);
    const bd = document.createElement('span');
    const label = badges.get(r.id);
    bd.className = `stat-badge${label !== '陪跑員' ? ' top' : ''}`;
    bd.textContent = label;
    head.append(av, rk, nm, bd);

    const body = document.createElement('div');
    body.className = 'stat-card-body';
    for (const [key, val, lbl] of [
      ['wins', r.wins, '食糊'],
      ['selfDraws', r.selfDraws, '自摸'],
      ['deals', r.deals, '出銃'],
    ]) {
      const cell = document.createElement('div');
      cell.className = 'stat-cell';

        const cr = document.createElement('span');

      l.className = 'lbl';
      l.textContent = lbl;
      cell.append(n, l);
      body.append(cell);

    card.append(head, body);
    cards.append(card);

  box.append(cards);

    mt.innerHTML = `<thead><tr>${head2.map((t) => `<th>${t}</th>`).join('')}</tr></thead>`;

    });
    mt.append(mb);
    box.append(h, mt);
  }
}

/**
 * 轉盤揀嘢：native picker 嘅感覺，靠 scroll-snap。
 *
 * 撳一個項目即刻生效（唔使等 scroll settle）；手指拖到邊個就等
 * scroll 停低（debounce）先算數，兩條路都會觸發 onChange。
 */
function wheelPicker({ items, selected = 0, onChange }) {
  const frame = document.createElement('div');
  frame.className = 'wheel-frame';
  const band = document.createElement('div');
  band.className = 'wheel-band';
  const wrap = document.createElement('div');
  wrap.className = 'wheel';
  const list = document.createElement('div');
  wrap.append(list);
  frame.append(band, wrap);

  const spacerTop = document.createElement('div');
  const spacerBottom = document.createElement('div');
  const realEls = [];
  list.append(spacerTop);
  items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'wheel-item';
    el.textContent = it.label;
    el.onclick = () => select(i, true);
    list.append(el);
    realEls.push(el);
  });
  list.append(spacerBottom);

  let itemHeight = 40;
  let current = Math.max(0, Math.min(items.length - 1, selected));

  function mark(i) {
    realEls.forEach((el, idx) => el.classList.toggle('on', idx === i));
  }
  function scrollToIndex(i, smooth) {
    wrap.scrollTo({ top: i * itemHeight, behavior: smooth ? 'smooth' : 'auto' });
  }
  function select(i, smooth) {
    i = Math.max(0, Math.min(items.length - 1, i));
    const changed = i !== current;
    current = i;
    mark(i);
    scrollToIndex(i, smooth);
    if (changed) onChange(i, items[i]);
  }

  let settleTimer;
  wrap.addEventListener('scroll', () => {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => {
      const i = Math.max(0, Math.min(items.length - 1, Math.round(wrap.scrollTop / itemHeight)));
      const changed = i !== current;
      current = i;
      mark(i);
      if (changed) onChange(i, items[i]);
    }, 110);
  }, { passive: true });

  requestAnimationFrame(() => {
    itemHeight = realEls[0]?.getBoundingClientRect().height || 40;
    spacerTop.style.height = `${2 * itemHeight}px`;
    spacerBottom.style.height = `${2 * itemHeight}px`;
    scrollToIndex(current, false);
    mark(current);
  });

  return { el: frame, get value() { return current; } };
}

/* ── 記一鋪牌：撳嗰隻牌，一個 sheet 度揀晒番數、出銃／自摸、包自摸 ── */

function pickScore(winner) {
  const v = variant();
  const c = session.config;
  const who = nameOf(session.seats[winner]);
  const opponents = [0, 1, 2, 3].filter((s) => s !== winner);

  // 番數 wheel 嘅內容淨係起計一次（用 'selfDraw' 攞 label/score 就夠）；
  // 個 note（金額）淨係喺 renderPreview 度先按實際 from 再算，
  // 咁樣轉「出銃／自摸」嗰陣唔使成個番數 wheel 重新起，唔會跳。
  const faanOptions = v.scoreOptions(c, { winner, from: 'selfDraw', round: session.round });
  const faanItems = [
    { label: '詐糊', misdeal: true },
    ...faanOptions.map((o) => ({ label: o.label, score: o.score })),
  ];
  const fromItems = [
    ...opponents.map((s) => ({ label: nameOf(session.seats[s]), seat: s })),
    { label: '自摸', seat: 'selfDraw' },
  ];

  let faanIdx = faanItems.length > 1 ? 1 : 0;
  let fromIdx = 0;
  let paoOn = false;
  let paoSeat = null;

  const currentFrom = () => fromItems[fromIdx].seat;
  const isSelfDraw = () => currentFrom() === 'selfDraw';
  const isMisdeal = () => !!faanItems[faanIdx].misdeal;

  function draw() {
    openSheet('食糊！', '幾多番、邊個出銃定自摸——揀晒佢再確定。', (sheet) => {
      if (isMisdeal()) {
        buildMisdeal(sheet);
        return;
      }

      const row = document.createElement('div');
      row.className = 'wheel-row';

      const faanCol = document.createElement('div');
      faanCol.className = 'wheel-col';
      faanCol.innerHTML = '<div class="wheel-col-label">番數</div>';
      const faanWheel = wheelPicker({
        items: faanItems,
        selected: faanIdx,
        onChange: (i) => {
          faanIdx = i;
          if (isMisdeal()) { draw(); return; }
          renderPreview();
        },
      });
      faanCol.append(faanWheel.el);

      const fromCol = document.createElement('div');
      fromCol.className = 'wheel-col';
      fromCol.innerHTML = '<div class="wheel-col-label">出銃 / 自摸</div>';
      const fromWheel = wheelPicker({
        items: fromItems,
        selected: fromIdx,
        onChange: (i) => {
          fromIdx = i;
          paoOn = false;
          paoSeat = null;
          draw(); // from 轉咗要現形／隱藏「包自摸」，成個 sheet 重畫一次
        },
      });
      fromCol.append(fromWheel.el);

      row.append(faanCol, fromCol);
      sheet.append(row);

      if (isSelfDraw()) sheet.append(buildPaoToggle());

      const preview = document.createElement('p');
      preview.className = 'wheel-preview';
      sheet.append(preview);

      function renderPreview() {
        const from = currentFrom();
        const opts = v.scoreOptions(c, { winner, from, round: session.round });
        const matched = opts[faanIdx - 1]; // faanItems[0] 係詐糊，真番數由 index 1 開始
        preview.innerHTML = `贏家收<b>${matched ? matched.note : '—'}</b>`;
      }
      renderPreview();

      const confirmRow = document.createElement('div');
      confirmRow.className = 'row';
      const ok = optionButton('確定', null, true);
      ok.onclick = commit;
      confirmRow.append(ok);
      sheet.append(confirmRow);
    });
  }

  function buildPaoToggle() {
    const wrap = document.createElement('div');
    const row = document.createElement('div');
    row.className = 'switch-row';
    const text = document.createElement('div');
    text.className = 'switch-text';
    text.innerHTML =
      '<div class="switch-label">出銃者包自摸</div><div class="switch-hint">一個人孭晒六份，其餘兩家唔使畀</div>';
    const sw = document.createElement('button');
    sw.className = `switch${paoOn ? ' on' : ''}`;
    sw.setAttribute('aria-pressed', String(paoOn));
    sw.onclick = () => { paoOn = !paoOn; if (!paoOn) paoSeat = null; draw(); };
    row.append(text, sw);
    wrap.append(row);

    if (paoOn) {
      const grid = document.createElement('div');
      grid.className = 'grid two';
      grid.style.marginTop = '.6rem';
      opponents.forEach((seat) => {
        const b = optionButton(nameOf(session.seats[seat]), null);
        b.classList.add('tight');
        if (paoSeat === seat) b.classList.add('on');
        b.onclick = () => { paoSeat = seat; draw(); };
        grid.append(b);
      });
      wrap.append(grid);
    }
    return wrap;
  }

  function buildMisdeal(sheet) {
    const base = unitFor(c.minFaan, c);
    const p = document.createElement('p');
    p.className = 'sub';
    p.style.marginTop = '0';
    p.textContent = `${who} 詐糊，要賠俾其餘三家，每人幾多？`;
    sheet.append(p);

    const input = document.createElement('input');
    input.type = 'number';
    input.min = '1';
    input.inputMode = 'numeric';
    input.value = String(base);
    sheet.append(input);

    const quick = document.createElement('div');
    quick.className = 'grid';
    quick.style.marginTop = '.6rem';
    [1, 2, 4].forEach((mult) => {
      const b = optionButton(String(base * mult), mult === 1 ? '起糊嗰份' : `×${mult}`);
      b.classList.add('tight');
      b.onclick = () => { input.value = String(base * mult); };
      quick.append(b);
    });
    sheet.append(quick);

    const row = document.createElement('div');
    row.className = 'row';
    const ok = optionButton('確定', null, true);
    ok.onclick = () => {
      const amt = Math.round(Number(input.value));
      if (!Number.isFinite(amt) || amt <= 0) { toast('金額唔啱'); return; }
      record([{ kind: 'penalty', by: winner, perPlayer: amt }], `${who} 詐糊，賠 ${amt}`);
    };
    row.append(ok);
    sheet.append(row);
  }

  function commit() {
    const opt = faanItems[faanIdx];
    const from = currentFrom();
    const how = from === 'selfDraw' ? '自摸' : `食 ${nameOf(session.seats[from])}`;
    const usePao = paoOn && paoSeat !== null;
    const events = [
      { kind: 'win', winner, from, score: opt.score, ...(usePao ? { pao: paoSeat } : {}) },
    ];
    const label = usePao
      ? `${who} ${how} ${opt.label}（${nameOf(session.seats[paoSeat])} 包自摸）`
      : `${who} ${how} ${opt.label}`;
    record(events, label);
  }

  draw();
}

/**
 * 玩法同賠率編輯器。
 *
 * 重點喺「大細」嗰行：唔係叫人填基數（冇人心目中係諗基數），
 * 而係揀一個番數講「呢個番數打幾大」，其餘成張表按級距自動跳。
 * 跳完即刻 render 返成張表——除唔盡會有出入，一定要俾人見到。
 */
function openRuleEditor() {
  let draft = { ...session.config };
  let presetName = session.presetName;
  let anchorFaan = Math.min(draft.maxFaan, Math.max(draft.minFaan, draft.maxFaan));

  function build() {
    openSheet('玩法同賠率', '揀個現成玩法，或者自己調。改咗即刻見到成張賠率表。', (sheet) => {
      const markCustom = () => { presetName = CUSTOM; };

      // ── 現成玩法 ──
      const presetField = document.createElement('div');
      presetField.className = 'field';
      presetField.innerHTML = '<label>現成玩法</label>';
      const presetGrid = document.createElement('div');
      presetGrid.className = 'grid two';
      for (const [name, cfg] of Object.entries(variant().presets)) {
        const b = optionButton(name, null);
        b.classList.add('tight');
        if (presetName === name) b.classList.add('on');
        b.onclick = () => {
          draft = { ...cfg };
          presetName = name;
          anchorFaan = draft.maxFaan;
          build();
        };
        presetGrid.append(b);
      }
      presetField.append(presetGrid);
      sheet.append(presetField);

      // ── 逐項調 ──
      const chooser = (label, values, current, onPick, fmtLabel = String) => {
        const wrap = document.createElement('div');
        wrap.className = 'field';
        wrap.innerHTML = `<label>${label}</label>`;
        const g = document.createElement('div');
        g.className = 'grid';
        for (const v of values) {
          const b = optionButton(fmtLabel(v), null);
          b.classList.add('tight');
          if (v === current) b.classList.add('on');
          b.onclick = () => { onPick(v); markCustom(); build(); };
          g.append(b);
        }
        wrap.append(g);
        sheet.append(wrap);
      };

      chooser('起糊番數', [1, 2, 3, 4, 5], draft.minFaan, (v) => {
        draft.minFaan = v;
        if (draft.maxFaan < v) draft.maxFaan = v;
        if (anchorFaan < v || anchorFaan > draft.maxFaan) anchorFaan = draft.maxFaan;
      }, (v) => `${v}番`);

      chooser('封頂番數', MAX_FAAN_CHOICES, draft.maxFaan, (v) => {
        draft.maxFaan = v;
        if (anchorFaan > v) anchorFaan = v;
      }, (v) => `${v}番`);

      chooser('級距', ['half', 'full'], draft.scale,
        (v) => { draft.scale = v; },
        (v) => (v === 'half' ? '半辣上' : '辣辣上'));

      chooser('找數', ['full', 'half'], draft.liability,
        (v) => { draft.liability = v; },
        (v) => (v === 'full' ? '全銃' : '半銃'));

      // ── 大細 ──
      const problem = validateConfig(draft);
      const stake = document.createElement('div');
      stake.className = 'field';
      stake.innerHTML = '<label>大細　—　揀一個番數，話我知佢個基數幾多</label>';

      if (!problem) {
        const anchorRow = document.createElement('div');
        anchorRow.className = 'anchor';

        const sel = document.createElement('select');
        sel.setAttribute('aria-label', '用邊個番數做基準');
        for (let f = draft.minFaan; f <= draft.maxFaan; f++) {
          const o = document.createElement('option');
          o.value = String(f);
          o.textContent = `${f}番`;
          if (f === anchorFaan) o.selected = true;
          sel.append(o);
        }
        const amountInput = document.createElement('input');
        amountInput.type = 'number';
        amountInput.min = '1';
        amountInput.inputMode = 'numeric';
        amountInput.setAttribute('aria-label', '打幾大');
        amountInput.value = String(unitFor(anchorFaan, draft));

        const apply = () => {
          const amount = Number(amountInput.value);
          if (!Number.isFinite(amount) || amount <= 0) return;
          try {
            draft.base = baseForAnchor(anchorFaan, amount, draft);
            markCustom();
            build();
          } catch { /* 輸入未完整，唔好嘈 */ }
        };
        sel.onchange = () => { anchorFaan = Number(sel.value); build(); };
        amountInput.onchange = apply;
        amountInput.onkeydown = (e) => { if (e.key === 'Enter') apply(); };

        anchorRow.append(sel, amountInput);
        stake.append(anchorRow);

        const quick = document.createElement('div');
        quick.className = 'row';
        const half = optionButton('細一半', null);
        const dbl = optionButton('大一倍', null);
        half.classList.add('tight');
        dbl.classList.add('tight');
        half.onclick = () => { draft.base = Math.max(1, Math.round(draft.base / 2)); markCustom(); build(); };
        dbl.onclick = () => { draft.base *= 2; markCustom(); build(); };
        quick.append(half, dbl);
        stake.append(quick);
      }
      sheet.append(stake);

      // ── 賠率表 ──
      if (problem) {
        const w = document.createElement('p');
        w.className = 'warn-line';
        w.textContent = problem;
        sheet.append(w);
      } else {
        const wrap = document.createElement('div');
        wrap.className = 'rate-wrap';
        const head = document.createElement('div');
        head.className = 'rate-head';
        head.textContent = '賠率表';
        const t = document.createElement('table');
        t.className = 'rates';
        t.innerHTML = '<thead><tr><th>番數</th><th>基數</th><th>出銃收</th><th>自摸收</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const { faan, unit } of unitTable(draft)) {
          const tr = document.createElement('tr');
          if (faan === anchorFaan) tr.className = 'anchor-row';
          for (const text of [`${faan}番`, String(unit), String(4 * unit), String(6 * unit)]) {
            const td = document.createElement('td');
            td.textContent = text;
            tr.append(td);
          }
          tb.append(tr);
        }
        t.append(tb);
        wrap.append(head, t);
        sheet.append(wrap);

        const note = document.createElement('p');
        note.className = 'note-line';
        note.textContent = draft.liability === 'full'
          ? '全銃：出銃者一人畀晒。自摸三家各畀一份。'
          : '半銃：出銃者畀雙份，其餘兩家各一份。自摸三家各畀一份。';
        sheet.append(note);
      }

      // ── 用呢個 ──
      const row = document.createElement('div');
      row.className = 'row';
      const started = session.hands.length > 0;
      const ok = optionButton(
        started ? '用呢個開新牌局' : '就用呢個',
        started ? '而家啲分會清零' : null,
        true,
      );
      if (problem) { ok.disabled = true; ok.style.opacity = '.45'; }
      ok.onclick = () => {
        if (problem) return;
        const keep = session.roster;
        const seats = session.seats;
        session = newSession(presetName, session.diceCount, { ...draft });
        session.presetName = presetName;
        session.roster = keep;
        session.seats = seats;
        lastRoll = null;
        closeSheet();
        render();
        toast(`開咗新牌局：${presetName}`);
      };
      row.append(ok);
      sheet.append(row);
    });
  }

  build();
}

    }
    sheet.append(grid);
  });
}

function pickSubstituteName(seat) {
  const outgoing = nameOf(session.seats[seat]);
  openSheet('換人', `${outgoing} 走咗，邊個頂上？`, (sheet) => {
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '新玩家個名';
    input.maxLength = 12;
    sheet.append(input);
    const row = document.createElement('div');
    row.className = 'row';
    const ok = optionButton('頂上', null, true);
    const go = () => {
      const name = input.value.trim();
      if (!name) return;
      // 新 id，唔會同走咗嗰個撈亂——所以兩個人嘅統計分得開
      const id = `p${Date.now().toString(36)}`;
      session = substitutePlayer(session, seat, { id, name });
      lastRoll = null;
      closeSheet();
      render();
      toast(`${name} 頂咗 ${outgoing}，${outgoing} 之前嘅數凍結咗`);
    };
    ok.onclick = go;
    input.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    row.append(ok);
    sheet.append(row);
    setTimeout(() => input.focus(), 50);
  });
}

function pickRound() {
  openSheet('莊家設定', '記漏咗或者搞錯咗？直接跳去啱嘅圈同局。', (sheet) => {
    const grid = document.createElement('div');
    grid.className = 'grid four';
    for (let pw = 0; pw < 4; pw++) {
      for (let hw = 0; hw < 4; hw++) {
        const b = optionButton(`${WIND_NAMES[pw]}圈${WIND_NAMES[hw]}風`, null);
        b.classList.add('tight');
        b.onclick = () => {
          session = { ...session, round: setRound(session.round, { prevailingWind: pw, handWind: hw }) };
          lastRoll = null;
          closeSheet();
          render();
          toast(`跳咗去 ${roundLabel(session.round)}`);
        };
        grid.append(b);
      }
    }
    sheet.append(grid);
  });
}

function confirmReset() {
  openSheet('新牌局', '而家嘅分數同紀錄會冇晒。玩法、名同座位會保留。', (sheet) => {
    const row = document.createElement('div');
    row.className = 'row';
    const ok = optionButton('開新牌局', null, true);
    ok.onclick = () => {
      const keep = session.roster;
      const seats = session.seats;
      const name = session.presetName;
      session = newSession(name, session.diceCount, { ...session.config });
      session.presetName = name;
      session.roster = keep;
      session.seats = seats;
      lastRoll = null;
      closeSheet();
      render();
      toast('開咗新牌局');
    };
    row.append(ok);
    sheet.append(row);
  });
}

function exportCSV() {
  const csv = toCSV(session.hands, nameOf);
  closeSheet();
  if (!csv.includes('\n')) {
    toast('未有牌可以匯出');
    return;
  }
  navigator.clipboard?.writeText(csv).then(
    () => toast('已經 copy 咗去剪貼簿'),
    () => toast('copy 唔到，請自己 select 個紀錄'),
  );
}

/* ── 落數 ── */

function record(events, label) {
  try {
    session = appendHand(session, events, variant().settle);
    lastRoll = null;
    closeSheet();
    render();
    toast(label);
  } catch (err) {
    toast(`記唔到：${err.message}`);
  }
}

/* ── 綁 ── */

for (let seat = 0; seat < 4; seat++) {
  $(`seat${seat}`).onclick = () => pickScore(seat);
}

$('drawBtn').onclick = () => record([{ kind: 'draw' }], '流局');
$('diceBtn').onclick = throwDice;
$('settings').onclick = openSettings;

$('undo').onclick = () => {
  const last = session.hands[session.hands.length - 1];
  if (!last) return;
  const label = describe(last);
  session = undoLastHand(session);
  lastRoll = null;
  render();
  toast(`還原咗：${label}`);
};

$('scrim').onclick = (e) => { if (e.target === $('scrim')) closeSheet(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

for (const b of document.querySelectorAll('.tab')) {
  b.onclick = () => setTab(b.dataset.tab);
}

/* ── 加到主畫面 ──
   Android/Chrome 會自己彈 install prompt；iOS 冇，要人手教。
   兩邊都係喺 http(s) 先有意思——直接開個檔案唔使裝。 */
function setupInstallHint() {
  const bar = $('a2hs');
  if (!bar) return;
  const DISMISSED = 'mahjong.a2hs.dismissed';
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  let dismissed = false;
  try { dismissed = localStorage.getItem(DISMISSED) === '1'; } catch { /* 私隱模式 */ }
  if (standalone || dismissed || !location.protocol.startsWith('http')) return;

  // navigator.standalone 淨係 Safari 有——用嚟分開「真 iPad」同「有觸控嘅 Mac」
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1 && 'standalone' in navigator);
  let deferred = null;

  const show = (html) => {
    bar.innerHTML = '';
    const text = document.createElement('span');
    text.innerHTML = html;
    const close = document.createElement('button');
    close.textContent = '唔使';
    close.onclick = () => {
      bar.hidden = true;
      try { localStorage.setItem(DISMISSED, '1'); } catch { /* 算 */ }
    };
    bar.append(text, close);
    bar.hidden = false;
  };

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    show('<b>加到主畫面</b>　用起上嚟同 app 一樣，離線都得。');
    const add = document.createElement('button');
    add.textContent = '加';
    add.onclick = async () => {
      bar.hidden = true;
      deferred.prompt();
      await deferred.userChoice;
      deferred = null;
    };
    bar.insertBefore(add, bar.lastChild);
  });

  if (isIOS) {
    show('<b>加到主畫面</b>　撳底下個「分享」掣 → 加至主畫面，之後開起上嚟就冇咗個網址列。');
  }
}
setupInstallHint();

/* 放上網之後可以離線用。file:// 開嗰陣冇 service worker，
   但嗰陣個檔案本身已經喺部機度，一樣離線行到。 */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* 打牌時個 mon 熄咗要重新撳，好煩 */
if ('wakeLock' in navigator) {
  const keepAwake = () => navigator.wakeLock.request('screen').catch(() => {});
  keepAwake();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
  });
}

/* ── 開波 ── */
session = load() ?? newSession(firstPreset());
setTab('log');
render();
if (session.hands.length > 0) toast(`接返上次：打咗 ${session.hands.length} 鋪`);

</script>
</body>
</html>
